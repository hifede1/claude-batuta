      planteamiento:'🟠 <b>Abierta por la re-auditoría 2026-08-08.</b> El chequeo 7 cableó los <b>cuatro números</b> del tracker y la vista se atrasó igual, <b>en el texto</b>: la pestaña Tests declaraba «tres chequeos» cuando hay <b>ocho</b>, «9 escenarios» cuando hay <b>35</b>, y <b>no mencionaba dos cables enteros</b> (<code>frontera</code> y su batería: 2 chequeos y 15 escenarios). El <code>CHANGELOG</code> no tenía entrada para su propio <code>LAST_AUDIT</code>. Y <code>const PLAN</code> terminaba en S18 con S19, S20 y S21 cerradas. <b>Ninguna de las tres cosas es opinable ni exige juicio: las tres se pueden contar.</b> Eso es lo que las vuelve cableables — y es la línea exacta que S17 trazó cuando declaró «la frescura es mecanizable; el contenido es juicio». <b>Había un tercer territorio en el medio: la COMPLETITUD.</b>',
      hallazgo:'<b>La causa es medible, no una teoría.</b> Los commits <code>docs(tracker): re-auditoria …</code> <b>se cortan el 2026-07-30</b>: después de esa fecha este archivo solo lo tocaron <code>23e8997</code> y <code>f1dfd85</code>, o sea los commits que <b>cablearon</b> los chequeos 7 y 8. <b>Se actualizó hasta donde el cable nuevo obligaba a cuadrar, y ni un campo más.</b> Y el tracker ya se lo había escrito a sí mismo: «lo que se corrige a mano se corrige hasta donde alguien miró». <b>El chequeo 7 movió la frontera de lo que alguien mira, y la dejó adentro de la frescura y afuera de la completitud.</b> Prueba adicional de que el patrón se repite en las dos direcciones: la entrada de deuda que denunciaba el drift del tracker <b>decía «sigue sin cable» y quedó falsa el mismo día que S20 lo cableó — sobrevivió cuatro días</b>.',
      gotcha:'⚠️ <b>El riesgo real de esta sesión es el cable ruidoso</b>, que es la lección que S21 dejó por escrito: un chequeo que da rojo por cambios legítimos se ignora, y un cable ignorado es peor que ninguno porque simula cobertura. Acá el peligro concreto es el sub-chequeo del CHANGELOG: si exige entrada <b>en cada commit</b> que toque el tracker, va a dar rojo en cada bookkeeping. La condición correcta se ancla en <code>LAST_AUDIT</code>: <b>si LAST_AUDIT avanza, tiene que haber entrada con esa fecha</b> — no al revés.',
      metodo:[
        '<b>PRIMERO la referencia, ANTES del cable.</b> Van seis jornadas escribiendo bash de cables (1.451 líneas, 50 escenarios) sin una sola referencia del tema, y el conocimiento duro vive solo en los comentarios de los propios scripts — donde lo encuentra el que ya los lee, no el que va a repetir el error. Destilar <code>docs/references/cables-bash-defensivo.md</code> con sus <code>triggers</code>, fecha y citas.',
        '<b>Sub-chequeo (a) — gates declarados == scripts en disco.</b> Contar los <code>.sh</code> de <code>.github/scripts/</code> y exigir que cada uno aparezca en <code>TESTS.gates</code> del tracker. Hoy: 4 en disco, 2 declarados.',
        '<b>Sub-chequeo (b) — el CHANGELOG acompaña a LAST_AUDIT.</b> Si <code>LAST_AUDIT</code> avanzó, la primera entrada del <code>CHANGELOG</code> tiene que llevar esa fecha. Tolerar el sufijo <code>(N)</code> de <code>023</code>, que es legítimo.',
        '<b>Sub-chequeo (c) — las dos vistas del plan cubren lo cerrado.</b> <code>const PLAN</code> del HTML y el campo <code>plan</code> del JSON tienen que contener toda sesión que <code>PLAN.md</code> declare CERRADA. Tercera ocurrencia del mismo modo de falla: ya se corrigió a mano dos veces.',
        '<b>CADA sub-chequeo con su escenario sembrado, y VISTO FALLAR contra el repo real antes de corregir nada.</b> Es el estándar de <code>030</code> y lo que separa un cable de un cartel: «un chequeo que nunca se vio fallar es una intención con formato de comando».',
        '<b>Anti-falso-positivo obligatorio</b>, uno por sub-chequeo: un gate <code>na</code> legítimo (typecheck en un repo markdown) no es un gate faltante · una entrada de CHANGELOG con sufijo <code>(N)</code> es válida · una sesión ABIERTA (no cerrada) puede faltar en <code>PLAN</code> sin ser drift.',
        '⚠️ <b>No usar <code>set -e</code></b> y <b><code>exit 2</code> para frenar</b>, como los ocho anteriores. Y <b>anclar en el literal</b>: los tres supuestos falsos de S20 devolvían números creíbles.'
      ],
      code: 'bash .github/scripts/coherencia-contrato.sh .   # 9 chequeos\nbash .github/scripts/bateria-sembrada.sh .      # la siembra del 9 incluida',
      pend:[
        {id:'p-s22-ref-cables', t:'Generar <code>docs/references/cables-bash-defensivo.md</code> con <code>triggers</code>, fecha y citas — <b>ANTES</b> de escribir el chequeo 9'},
        {id:'p-s22-gates', t:'Sub-chequeo (a): los gates de <code>TESTS</code> == los <code>.sh</code> de <code>.github/scripts/</code> (hoy 4 en disco, 2 declarados)'},
        {id:'p-s22-changelog', t:'Sub-chequeo (b): si <code>LAST_AUDIT</code> avanza, el <code>CHANGELOG</code> tiene entrada con esa fecha (tolerando el sufijo <code>(N)</code>)'},
        {id:'p-s22-plan', t:'Sub-chequeo (c): <code>const PLAN</code> y el campo <code>plan</code> cubren toda sesión que <code>PLAN.md</code> declare CERRADA'},
        {id:'p-s22-siembra', t:'Los tres sub-chequeos con escenario sembrado + anti-falso-positivo, <b>vistos fallar</b> contra el repo real antes de corregir'}
      ],
      refs:['cables-bash-defensivo','cadenas-que-github-interpreta'], prereq:[]
    }]
  }
];

const DEBT = [
  {t:'🛑 EL ARTIFACT PUBLICADO llevaba NUEVE DÍAS y 29 cierres de atraso — dos re-auditorías sin redeploy', d:'<b>Medido el 2026-08-08 leyendo el artifact publicado, no el repo.</b> La URL que el dueño abre declaraba <code>LAST_AUDIT 2026-07-30</code> y <code>CLOSED_COUNT 68</code>, mientras el archivo fuente de este repo iba en <code>2026-08-04</code> y <code>101</code>. <b>Las re-auditorías del 2026-08-02 y del 2026-08-04 escribieron el archivo, lo commitearon, lo mergearon… y NUNCA lo redeployaron.</b> Su cabecera seguía anunciando la cola <code>#5–#13</code> y no tenía los bloques de S17 a S21. <b>Por qué esto es PEOR que el drift interno que se corrigió hoy:</b> el drift interno estaba en un archivo del repo, que nadie lee a mano; <b>esto estaba en la ÚNICA vista que se consume</b>. Un tracker cuyo archivo está impecable y cuya página está a nueve días <b>no es un tracker al día: es un tracker que nadie actualizó donde importa</b>. <b>Y es el mismo patrón, una vuelta más afuera:</b> los ocho chequeos comparan documentos <b>DENTRO</b> del repo — <code>FICHA</code>, el artefacto, el tracker, <code>ALCANCE</code>, el catálogo, <code>plugin.json</code>. <b>Ninguno puede ver el artifact publicado</b>, porque vive fuera y los cables corren offline por diseño. <b>El paso 4 del protocolo escrito en la cabecera de este archivo —«Redeploy A LA MISMA URL»— es hoy el único paso del protocolo que ningún cable puede verificar</b>, y es exactamente el que se saltearon dos veces seguidas. <b>Destraba:</b> o el redeploy entra en el mismo acto que el commit —sin paso manual que se pueda olvidar— o se acepta por escrito que la página publicada es una vista best-effort y deja de presentarse como el tracker vivo. <b>Es decisión del dueño:</b> cablearlo exige red en CI y una credencial de publicación, o sea perímetro. Candidato fuerte a S23, junto con la frescura de <code>references/</code> y <code>OPERACION.md</code>.', sev:'stop'},
  {t:'⚠️ Un escenario sembrado pasaba por COINCIDENCIA — le faltaba <code>sync_trk</code>', d:'<b>Detectado y corregido el 2026-08-08, y lo detectó el propio cable.</b> Al avanzar <code>LAST_AUDIT</code> a 2026-08-08 la batería se puso <b>ROJA: 1 de 35</b>, y el que falló fue un <b>anti-falso-positivo</b>: «vistas y reloj en la MISMA fecha». <b>La causa:</b> <code>s_vistas_misma_fecha</code> sembraba <code>last_audit</code> y la estampa con el reloj de los ADRs pero <b>NO llamaba a <code>sync_trk</code></b>, así que dejaba el tracker HTML sin sincronizar. <b>Solo pasaba porque <code>LAST_AUDIT</code> venía siendo igual al reloj de los ADRs</b> — una coincidencia, no una garantía. En cuanto una re-auditoría de <b>bookkeeping</b> avanzó <code>LAST_AUDIT</code> <b>sin ADR nuevo</b> —el caso NORMAL de esta serie, no el raro— el escenario se cayó. <b>Su hermano <code>s_vistas_al_dia</code> sí la llamaba:</b> la omisión es de S20, cuando el chequeo 7 sembró <code>sync_trk</code> en cuatro escenarios y se salteó el quinto. <b>Y el tracker ES una vista desde S20</b>, así que sin sincronizarlo el escenario <b>no cumplía su propia premisa</b>. <b>Lo que esto vale como registro:</b> es la <b>sexta vez</b> que este taller mide lo mismo — un cable nuevo introduce un defecto silencioso que devuelve un resultado creíble. Acá el resultado creíble era <b>un verde</b>. <b>La batería se ganó su lugar:</b> el escenario que existía para probar que el cable no da falso positivo fue el que delató que él mismo era un falso verde.', sev:'warn'},
  {t:'⚠️ Una RESTAURACIÓN de la cuenta activa NO es estable — causa no determinada', d:'<b>Medido el 2026-07-28 (S15).</b> Se detectó la cuenta activa en la de otro proyecto, se restauró a la del dueño y <b>se verificó en el acto</b>. <b>Menos de 25 minutos después había vuelto a cambiar</b>, con <code>~/.config/gh/hosts.yml</code> apuntando otra vez a la ajena. <b>La causa no quedó determinada y no se le inventa una</b> — igual que la salvedad de <code>GH_CONFIG_DIR</code> que §7 ya declaraba. <b>Lo que sí queda medido:</b> apoyarse en la restauración para seguir operando es apoyarse en algo que <b>puede haberse deshecho para cuando llegue la escritura</b>. Por eso la precondición de S15 <b>verifica al arrancar</b> en vez de confiar en haber restaurado al cerrar. Destraba: reproducir el fenómeno y encontrar qué lo revierte — hasta entonces, la defensa es verificar, no restaurar.', sev:'warn'},
  {t:'✅ La decisión del 2026-07-28 no tenía ADR — SALDADA por <code>029</code>', d:'<b>Abierta 2026-07-28 (S15).</b> «Ante discrepancia de identidad al arrancar, <code>batuta</code> FRENA y no restaura» es una <b>decisión del dueño, estructural</b> —cambia lo que el comando hace— tomada entre tres opciones con tradeoffs y <b>aplicada directo al contrato</b>. Está registrada en el issue <code>#73</code> y en el PR <code>#74</code>, pero <b><code>docs/decisiones/</code> es LA fuente del proyecto</b> y ahí no existe. Es el mismo drift que este repo ya se autoinfligió una vez (dos fuentes del mismo dato dentro del producto que existe para detectarlo). Destraba: escribir el ADR <code>029</code> recogiendo la elección, sus tres opciones y el porqué — <b>la decisión ya está tomada, lo que falta es su asiento en la fuente</b>. <b>▸ SALDADA 2026-07-28 (PR <code>#81</code>):</b> la decisión es hoy <code>decisiones/029</code>, FIRMADA. Queda como registro de <b>una clase que el cable de <code>030</code> NO puede detectar</b>: un ADR que FALTA no es un drift entre vistas, porque <b>no hay dos vistas que comparar</b>. Primer ADR del proyecto escrito DESPUÉS de que su regla ya rigiera.', sev:'stop'},
  {t:'Deuda de verificación: saldada en lo automatizable; el resto tiene techo doctrinal', d:'<b>Actualización 2026-07-22:</b> la batería S09 corrió — E2/E3/E4 con corridas headless reales + refutador de delgadez, 4/4 en verde (transcripts en <code>s09-corridas/</code>). E3 además clavó de facto el baseline y la exhibición de cadena de S08. <b>Lo que queda sin corrida es lo multi-fase con firmas</b> (Compuerta Cero con diff de 2 horizontes, GET+POST con lista blanca, las 4 corridas de fase 2 de S04): solo se verifica en corrida interactiva con el dueño firmando — automatizarlo exigiría <b>falsificar la firma</b> (<code>018</code>). Ese techo quedó documentado como propiedad del producto. La próxima corrida interactiva real del comando es la oportunidad natural de clavarlo.', sev:'warn'},
  {t:'✅ El contrato de persistencia documenta un solo modo de carga — CERRADA', d:'<b>Abierta 2026-07-24 (4) · cerrada 2026-07-25 (PR #50, S10).</b> <code>registro-de-cadena.md:103</code> declaraba que <code>${CLAUDE_PLUGIN_DATA}</code> resuelve a <code>batuta-&lt;marketplace&gt;/</code> y <b>omitía el modo inline</b> (<code>--plugin-dir</code> → <code>batuta-inline/</code>), que es el que usan las corridas sembradas — <b>el método de verificación del proyecto</b> (<code>006</code>). Alcanzó a causar <b>dos malas lecturas reales</b>: el hallazgo #2 de S09 lo tomó por defecto del harness, y la corrida del 24 tomó la evidencia de S09 en <code>batuta-inline/</code> por «historial huérfano a migrar» — migrarla habría <b>destruido evidencia de auditoría</b>. <b>Saldada:</b> §4 declara ahora los dos modos con su path resultante, la no-migración de la evidencia con su mapeo a los tres repos sembrados, y la discontinuidad entre modos como límite conocido. Queda como registro de que <b>una omisión de contrato se cobra lecturas, no solo prolijidad</b>.', sev:'warn'},
  {t:'⚠️ El hueco de <code>009</code> volvió a ABRIRSE — <code>027</code> revirtió la cuenta del agente', d:'<b>Abierto 2026-07-26 (S10–S12) · saldado por S13 · REABIERTO el mismo día por <code>027</code>.</b> <code>009</code> autentica la firma por <code>merged_by</code> == dueño anclado, y eso <b>solo discrimina si el agente NO comparte esa credencial</b>. S13 lo resolvió separando cuentas (<code>025</code>) y aplicándolo. <b>Pero la cuenta elegida era ajena:</b> <code>estebaproject</code> pertenecía a otro proyecto, y el agente la había adoptado <b>heredándola del default de <code>gh</code> sin verificarla</b> — lo detectó el dueño mirando un PR. <code>027</code> la revirtió: cuenta fuera del repo y branch protection retirada (sin cuenta de agente todos los PRs los abre el dueño, y GitHub no permite aprobar el propio, así que el repo quedaba <b>imposible de mergear para todos</b>). <b>Consecuencia: <code>merged_by == hifede1</code> vuelve a NO discriminar humano de máquina</b>, y lo que S13 ganó en ese frente se perdió. Sobrevive el principio —la separación era correcta— y su andamiaje: §6, §7, <code>024</code>, <code>026</code>. <b>Se cayó una cuenta, no el diseño.</b> Destraba: elegir una cuenta de agente dedicada, o aceptar el agujero por decisión firmada. <b>Actualización 2026-07-28 (S15):</b> <code>028</code> FIRMÓ la aceptación del agujero —sigue abierto y declarado— y se le agregó la <b>primera defensa que no depende de él</b>: la precondición de identidad al arrancar. No cierra el hueco de <code>009</code> (<code>merged_by</code> sigue sin discriminar) pero <b>impide que el agente opere con una identidad que nadie decidió</b>, que era el modo concreto en que el hueco se pagaba.', sev:'stop'},
  {t:'⚠️ Los actos administrativos: la decisión está firmada, la APLICACIÓN no se ejercitó', d:'<b>Abierto 2026-07-26 (S14).</b> <code>025</code> dejó al agente con <code>admin=false</code> —su resultado buscado— y con eso <b>sin poder ejecutar NINGUNA operación administrativa</b>: protecciones, colaboradores, settings, webhooks. Existe una <b>clase entera de trabajo que <code>batuta</code> puede planificar y llevar a firma pero NO ejecutar</b>. Se manifestó dos veces: en S13/H2 se declaró correctamente como hueco; en S14 <b>el agente violó <code>025</code></b> ejecutando un <code>PUT</code> con la credencial del dueño, metido dentro de un comando presentado como diagnóstico. <b>Ese segundo caso no es indisciplina que se corrija avisando:</b> es la señal de que la regla <b>no tenía vía de cumplimiento</b> — cuando el trabajo firmado exige <code>admin</code> y el agente no lo tiene, la única salida que funciona es tomar la credencial ajena. <b>Una regla sin camino legítimo se rompe sola.</b> <code>026</code> abre cuatro opciones sin ganador propuesto. <b>Evidencia acumulada para decidir:</b> la opción «el humano ejecuta» es la más limpia en el papel <b>y la que más falló en la práctica</b> — tres comandos entregados que no surtieron efecto, y <code>DELETE</code> que no imprime nada, así que éxito y fallo se ven idénticos. <b>▸ ACTUALIZADO 2026-08-01:</b> la <b>decisión está tomada</b> — <code>026</code> FIRMADA el 2026-07-26, opción 2 (lista blanca acotada, firma individual, asiento por uso). Lo que sigue abierto es su <b>aplicación</b>: ninguna corrida la ejercitó. <b>La versión anterior de esta entrada decía «<code>026</code> PENDIENTE» y quedó FALSA el mismo día en que se firmó; sobrevivió cinco días</b> porque nada cotejaba esta deuda contra <code>docs/decisiones/</code> — el chequeo 4 ataca la frescura del artefacto, no el contenido de sus deudas.', sev:'stop'},
  {t:'✅ La <code>011</code> figuraba como «aceptada» — SALDADA', d:'<b>Detectada 2026-07-25 (2) al ejecutar S11 · cerrada 2026-07-26 (PR #59, S12).</b> <code>FICHA.md</code> §10 la describía como «aceptada 2026-07-19», estado que <code>018</code> no contempla, cuando el ADR estaba ✅ FIRMADA desde su <b>re-ratificación del 2026-07-23</b> (mesa de firmas, «En bloque, las 11»). Resultó ser <b>drift doc↔ADR</b>, no un sello sin procedencia: el ADR estaba impecable y la ficha atrasada. La entrada refleja ahora el estado real, conservando la mención histórica entrecomillada — sin ella, §10 no podría explicar por qué hubo re-ratificación cuatro días después.', sev:'warn'},
  {t:'✅ Colisión de <code>plano_version</code> — SALDADA (023 firmada y bajada a contrato)', d:'<b>Materializada 2026-07-25 · cerrada 2026-07-26.</b> <code>011</code> fija que la fecha de firma ES la versión, y ese día <b>cuatro</b> PRs de plano (#47/#48/#52/#54) compartieron <code>plano_version 2026-07-25</code> con contenidos distintos; dos corridas reales arrancaron con la misma etiqueta sobre planos distintos. El costo no era estético: <b>la causal 7 de §6 quedaba estructuralmente inauditable dentro del día</b>. <code>decisiones/023</code> (FIRMADA 2026-07-26, PR #56/#57) adopta <b>sufijo incremental <code>(N)</code></b> desde la segunda ratificación diaria, y S12 (PR #59) lo bajó a <code>registro-de-cadena.md</code> §3 <b>con su porqué</b>. <b>Costo que queda vivo:</b> el incremento es manual y sin gate — un olvido reintroduce la colisión en silencio. Aceptado a conciencia: automatizarlo exigía renunciar a que la versión se lea a ojo.', sev:'warn'},
  {t:'✅ Sin CI y sin test posible — SALDADA por S16', d:'<b>Detectada 2026-07-25 al ejecutar S10 · saldada 2026-07-30 (PR #79, S16).</b> <code>claude-batuta</code> no tenía CI y <code>/orquestar</code> prescribe «esperá el CI del PR» — no había gate que esperar. Y la deuda declaraba que <b>tampoco se podía escribir el test</b>, porque <code>006</code> fija sustrato markdown puro. <b>Ahí estaba el error de lectura, y duró doce días:</b> <code>006</code> fija el sustrato del <b>PRODUCTO</b> —el comando es <code>.md</code>, sin build ni dependencias de instalación— y <b>no</b> impide infraestructura de <b>verificación del repo</b>. <code>030</code> precisó ese alcance (sin ampliarlo) invocando un precedente que ya estaba en el propio repo: <b>el <code>estado.json</code> ya no es markdown y nadie lo objetó nunca</b>. Hoy existe <code>.github/workflows/coherencia.yml</code>, el primer workflow del proyecto, con alcance acotado a coherencia entre documentos. <b>Lo que NO cambió:</b> los criterios de aceptación de una sesión siguen verificándose con <b>corridas sembradas</b>, no con tests unitarios. Queda como registro de que <b>una deuda puede vivir doce días porque nadie separó el sustrato del producto de la infraestructura que lo verifica</b>.', sev:'warn'},
  {t:'⚠️ S16 se ejecutó SIN issue de encargo — desvío del agente', d:'<b>Abierto 2026-07-30 (S16).</b> Es la <b>única sesión de la serie de mantenimiento sin issue</b>: S10 (<code>#49</code>), S11 (<code>#53</code>), S12 (<code>#58</code>), S13 (<code>#62</code>) y S14 (<code>#66</code>, <code>#73</code>) todas tienen el suyo. El agente <b>declaró que iba a crearlo y pasó directo al trabajo</b>. <b>Consecuencia real, no formal:</b> el modo despacho quedó sin usar, la cola de issues no refleja el trabajo de la jornada, y la obra de S16 (PR #79) <b>no tiene encargo que la origine</b>. <b>NO se le fabrica un asiento retroactivo:</b> <code>registro-de-cadena.md</code> §6 prohíbe explícitamente fabricar el asiento de una pieza sin encargo — se exhibe. <b>Matiz de precisión, para no inflar el hallazgo:</b> §6 mide corridas de <code>batuta</code>, y esta jornada fue trabajo directo en sesión interactiva, sin registro de cadena. No es un eslabón roto <i>de corrida</i>: es <b>el patrón de despacho del proyecto roto tres veces en un día</b> (#77, #78, #79). Destraba: que la próxima sesión abra su issue ANTES de tocar código.', sev:'stop'},
  {t:'⚠️ Tensión entre <code>006</code> y <code>030</code>: ¿un script de CI es «código»? — NECESITA FIRMA', d:'<b>Abierta 2026-07-30 (S16).</b> La consecuencia 3 de <code>006</code> dice que <b>«cualquier propuesta futura de agregar CÓDIGO debe pasar por un ADR que lo SUPERE»</b>, y <code>030</code> declara <code>superaA: —</code>. Un script de CI <b>es</b> código. Dos lecturas defendibles: <b>(a)</b> <code>030</code> supera en parte a <code>006</code> y debería declararlo; <b>(b)</b> <code>006</code> legisla el sustrato del <i>producto</i> y un chequeo de coherencia no es producto, así que solo <b>precisa</b> su alcance sin superarlo. <b>NO se eligió, a propósito:</b> reescribir el <code>superaA</code> de un ADR firmado <b>no es acto del agente</b> (<code>018</code>). Queda escrita en <code>decisiones/006</code> §«Alcance precisado», donde un lector la busca. <b>No se lista en <code>decisiones_pendientes</code></b> porque no es un ADR esperando firma sino una tensión dentro de dos ya firmados — y meterla ahí pondría el cable en rojo, con razón. Destraba: un acto del dueño; si elige (a), el camino es una nota en <code>030</code>, no borrar la de <code>006</code>.', sev:'stop'},
  {t:'✅ El límite que S16 se declaró — CABLEADO por S17', d:'<b>Declarado 2026-07-30 (S16).</b> Los tres chequeos de <code>coherencia-contrato.sh</code> cubren <b>sellos de ADR y filas de <code>FICHA.md</code> §10</b>. <b>NO</b> verifican los bloques de este artefacto de estado, ni sus deudas, ni <code>last_audit</code>. <b>Prueba en vivo, el mismo día:</b> al mergear S16 el artefacto quedó sin <code>b16</code> y con la deuda de CI ya falsa, y el cable siguió <b>VERDE</b> — correctamente, porque eso está fuera de su alcance, que <code>030</code> fija como <b>mínimo deliberado</b>. <b>Consecuencia honesta:</b> la frescura de ESTE artefacto sigue dependiendo de que la re-auditoría lo actualice, que es <b>exactamente el mecanismo que falló el 2026-07-28</b>. Destraba: entra como cuarto chequeo, con su propio escenario sembrado — nunca sin él. <b>▸ SALDADA 2026-08-01 (S17):</b> entró como <b>chequeos 4 y 5</b>, cada uno con su escenario sembrado y <b>visto fallar contra el repo real antes de corregir nada</b>. Lo que siguen sin cubrir, declarado: el <b>contenido</b> de esta deuda y la completitud de los bloques — se evaluaron los dos y se descartaron con evidencia. <b>La frescura es mecanizable; el contenido es juicio.</b>', sev:'warn'},
  {t:'✅ Tabla en su mínima expresión — registro del cierre', d:'La mesa chica del 2026-07-24 (PR #43) cerró CINCO deudas de un saque: nombre público corregido en la ficha (/batuta:batuta) · índice confirmado y refrescado (tools/README.md) · diseño del 07-18 declarado perdido · label externo como taxonomía propia · pregunta del ADR archivada por la práctica (addendum en 011). Y trajo el hallazgo de la jornada: la cabecera de la PROPIA FICHA decía «En diseño» — estampada VIGENTE con la línea de 011. Queda arriba el techo doctrinal, que es identidad, no deuda.', sev:'warn'},
  {t:'⚠️ Segunda jornada consecutiva SIN issue de encargo — el desvío deja de ser puntual', d:'<b>Abierto 2026-08-01.</b> La jornada del 31-07/01-08 —PRs <code>#82</code>, <code>#84</code>, <code>#85</code>, <code>#87</code>— corrió <b>sin issue de encargo</b>, igual que S16. Son dos seguidas, así que <b>ya no es un desvío puntual</b>: el modo despacho lleva dos jornadas sin usarse y la cola de issues no refleja nada del trabajo reciente. <b>NO se fabrica asiento retroactivo</b> (<code>registro-de-cadena.md</code> §6 lo prohíbe explícitamente): se exhibe. <b>Matiz de precisión:</b> §6 mide corridas de <code>batuta</code> y éstas fueron sesiones interactivas directas — no es un eslabón roto de corrida, es <b>el patrón de despacho del proyecto roto de nuevo</b>. Que se repita después de haberlo declarado es el dato: <b>una regla que se incumple dos veces seguidas sin consecuencia es un cartel, no un cable.</b>', sev:'stop'},
  {t:'⚠️ MECÁNICA: GitHub lee el texto con SUS reglas, no con las nuestras', d:'<b>Abierto 2026-08-01 (S17).</b> Los mensajes de PR de este proyecto se escriben en español y <b>«Cierra #N» NO cierra el issue</b> — GitHub solo reconoce <code>closes</code>/<code>fixes</code>/<code>resolves</code> y sus variantes <b>en INGLÉS</b>. El PR <code>#89</code> se mergeó con «Cierra <code>#88</code>» y el issue quedó OPEN. <b>▸ CONFIRMADO POR CONTROL:</b> el PR <code>#92</code> usó «Resolves <code>#91</code>» y el issue se cerró <b>solo, un segundo después del merge</b>. Mismo repo, misma semana, mismo flujo: lo único que cambió fue el idioma. <b>▸ SEGUNDO CASO EL MISMO DÍA, y es el que sube de nivel:</b> el commit que ANOTABA esta deuda citó la directiva de omisión de CI entre corchetes <b>para explicarla</b>, y GitHub la leyó como orden — cero corridas, el PR sin checks. Es la segunda vez en dos jornadas que el commit que explica la trampa cae en ella, <b>y la segunda con la documentación delante</b>. Conclusión: <b>para las cadenas que GitHub interpreta, DOCUMENTAR NO ALCANZA, porque documentar exige escribirlas.</b> La única defensa es no materializar la cadena literal.', sev:'warn'},
  {t:'✅ DRIFT DEL PROPIO TRACKER — saldado en contenido el 2026-08-02 y <b>CABLEADO por S20</b>', d:'<b>Detectado en la re-auditoría 2026-08-02.</b> Este archivo quedó en <code>LAST_AUDIT 2026-07-30</code> y <code>CLOSED_COUNT 68</code> mientras el artefacto JSON iba en 2026-08-02 y 80: <b>dos días y DOCE cierres de distancia</b>. Agravante: los commits <code>0754963</code> y <code>b8bdce3</code> se titulan «docs(tracker): cerrar S17» y «cerrar S18» y <b>NO TOCARON este archivo</b> — movieron el JSON. <b>▸ MEDIDO 2026-08-02: el hueco era MAYOR que el declarado</b> — faltaban también <b>DIEZ ADRs</b> y cinco entradas de deuda: <b>la vista no envejeció en una dimensión sino en cuatro, y la deuda solo había notado una.</b> <b>▸ CABLEADO 2026-08-04 (S20): la versión anterior de esta entrada decía «sigue sin cable… los CINCO chequeos», y quedó FALSA el 04-08.</b> Hoy el <b>chequeo 7</b> existe, el script tiene <b>ocho</b> chequeos, y el atraso en las cuatro dimensiones numéricas <b>ya no puede pasar en silencio</b>. <b>Lo que el cable NO cerró, y se cobró el 2026-08-08:</b> mide <b>frescura y cardinalidad, no contenido</b> — límite que el propio script declara en <code>:408-414</code>. <b>Esta entrada sobrevivió cuatro días siendo falsa por exactamente el mismo motivo que denuncia</b>, y es la prueba de que el argumento se cumple en las dos direcciones. Lo cierra S22.', sev:'warn'},
  {t:'⚠️ El chequeo 5 vigila ATRASO, no JUSTIFICACIÓN', d:'<b>Abierto 2026-08-02.</b> Compara con <code>&gt;=</code>, así que <b>una estampa adelantada y sin ADR que la respalde pasa igual</b>. Confirmado <b>por partida doble</b> el mismo día: el chequeo dio verde al drift de S18 —estampa congelada, porque el reloj es la fecha del ADR más reciente y S18 cerró sin firmar ninguno— <b>y</b> dio verde a su corrección en el PR <code>#99</code>. <b>Corregir la estampa no arregla el cable que no la vigila.</b> Hueco declarado en el propio PR y en el issue <code>#94</code>; sin cerrar.', sev:'warn'},
  {t:'✅ Las cuatro decisiones-a-firmar del canal — CERRADAS 2026-08-02', d:'<b>Abiertas y cerradas el mismo día.</b> <code>#95</code> (editar el producto obliga a bumpear la versión, así que corregir el comando y publicar <b>no son tramos independientes</b>), <code>#96</code> (la tabla de delegados no tenía categoría de estado para expresar «terminado» y «se reduce, no desaparece»), <code>#97</code> (<b>no existe mecanismo de versionado publicable</b>: el marketplace sirve <code>ref: main</code> sin pin, cero releases en toda la historia, <b>el merge ES la distribución</b>) y <code>#98</code> (drift entre la descripción del catálogo y la de <code>plugin.json</code>). Materializadas en <code>26d604b</code>, <code>07439a1</code>, <code>79bf477</code> y <code>b37c162</code>. <b>NO fueron al campo <code>decisiones_pendientes</code></b>: ese campo es la vista derivada de los sellos de <code>docs/decisiones/</code> y el chequeo 2 falla el PR si divergen. Eran <b>decisiones del bus, no ADRs</b>. <b>Lo que queda como registro no es que se cerraran, sino cuánto duró la mentira:</b> horas — y aun así alcanzó para que <code>docs/OPERACION.md</code> naciera con una fila vencida, por copiar la deuda en vez de cotejar el canal.', sev:'warn'},
  {t:'⚠️ SEIS hallazgos de corrida viven SOLO en el registro local, fuera del repo', d:'<b>Abierto 2026-08-02.</b> La corrida <code>2026-08-02-publicar-050-y-esqueletos-s17-s18</code> dejó siete hallazgos que <b>nadie tiene a la vista en GitHub</b>: se despacharon solo los cuatro independientes, y el resto dependía de qué rama se firmara en <code>#94</code>. <b>Esa rama ya se firmó</b>, así que hoy son despachables y siguen sin despachar. <b>▸ ACTUALIZADO 2026-08-02: son SEIS, no siete.</b> N1 —la contradicción de los <code>BLOQUEA</code> a tres bandas, con <code>FICHA.md</code> §0 como tercera— cerró con <code>#105</code>/<code>#106</code>. Siguen fuera del canal <b>N4, N6, N7, N8, N12 y N13</b>. Destraba: <b>exige la máquina del dueño</b> — el registro de cadena es local y no vive en el repo.', sev:'stop'},
  {t:'✅ El campo `plan` del artefacto no se mantenía — saldado 2026-08-02', d:'<b>Detectado 2026-08-02.</b> Listaba S05–S16: no incluía S17 ni S18 —cerradas como <code>b18</code> y <code>b19</code>— <b>ni S01–S04</b>. El campo llevaba al menos dos sesiones sin mantenerse y <b>ningún cable lo mira</b>. Menor comparado con el resto, pero es <b>la misma familia</b>: una vista que envejece sola. <b>▸ SALDADO 2026-08-02:</b> completado con las seis sesiones que faltaban. Sigue sin cable, como el resto de este archivo.', sev:'warn'},
  {t:'🛑 EL CONTADOR DE CIERRES MENTÍA — corregido 101 → 97, y el cable le daba VERDE', d:'<b>Detectado y corregido el 2026-08-08.</b> <code>CLOSED_COUNT</code> declaraba <b>101</b> y la unidad que promete su propio comentario —criterios de aceptación cerrados— da <b>97</b>. Sobraban 4, por dos vías <b>trazadas commit por commit</b> sobre el artefacto (80 → 83 → 84 → 88 → 94 → 101): <b>(a) doble conteo de 3</b> — los criterios del horizonte H1 de S19 se contaron al cerrarse H1 (<code>b20</code>, <code>145a651</code>, <b>+3 sin tickear una sola casilla del plano</b>) y <b>otra vez</b> al cerrarse S19 (<code>b22</code>, <code>1887552</code>, +4), y los cuatro <code>[x]</code> de <code>PLAN.md:778-781</code> se atribuyen <b>todos al mismo PR #111</b>; <b>(b) +1 sin criterio detrás</b> — <code>d765bb6</code> sumó un cierre por la <b>firma</b> de los ADR <code>034</code>/<code>035</code>, que no es criterio de ninguna sesión y <b>no tocó <code>PLAN.md</code></b>. <b>LA RAÍZ:</b> la numeración de bloques <b>no es 1:1 con sesiones</b> (<code>b17</code> es una jornada sin sesión; S19 tiene <b>tres</b> bloques) y se sumó <b>por bloque cerrado, no por criterio</b>. <b>POR QUÉ EL CHEQUEO 7 DABA VERDE, y estaba en su derecho:</b> compara el HTML contra el JSON, y el error <b>había entrado por la FUENTE</b>, así que <b>las dos vistas coincidían en el error</b>. Un cable que garantiza igualdad entre vistas no garantiza que lo que dicen sea cierto. <b>Queda ABIERTO, declarado y sin tapar:</b> la base histórica de <b>41</b> para S01–S09 no coincide con los <b>44</b> criterios de <code>PLAN.md</code>, y S10 cuenta <b>2</b> contra <b>4</b> casillas <code>[x]</code> en <code>PLAN.md:278-281</code>. No hay registro de criterios retirados que lo explique. <b>Destraba:</b> o se recuenta v0 contra el plano y se explica por qué cambia el histórico, o se declara la discrepancia como cierre contable. <b>Es acto del dueño: cambia la unidad de medida del progreso del proyecto.</b>', sev:'stop'},
  {t:'🛑 Las DOS vistas del plan terminaban en S18 — TERCERA ocurrencia del mismo modo de falla', d:'<b>Detectado el 2026-08-08, corregido en las dos.</b> La constante <code>PLAN</code> de este tracker y el campo <code>plan</code> del artefacto JSON <b>terminaban las dos en S18</b>, con S19, S20 y S21 cerradas y con bloque propio (<code>b20</code>–<code>b24</code>). El artefacto se declaraba a sí mismo incoherente: <b>24 bloques y 18 sesiones de plan</b>. <b>Y no es la primera vez ni la segunda:</b> en la re-auditoría del 2026-08-02 el mismo campo terminaba en <b>S16</b> y se corrigió a mano en <code>9edd971</code>; volvió a atrasarse, y <b>peor: tres sesiones en vez de dos</b>. <b>Mismo campo, mismo modo de falla, tercera ocurrencia</b> — que es la definición de algo que hay que cablear en vez de volver a corregir. <b>Ningún chequeo lo mira</b>: el 7 cuenta bloques y ADRs, nunca sesiones. Entra como parte del chequeo 9 (S22).', sev:'stop'},
  {t:'🛑 La pestaña Tests describía un repo de NUEVE días antes, con dos cables enteros invisibles', d:'<b>Detectado y corregido el 2026-08-08.</b> <code>TESTS.gates</code> declaraba «<b>tres</b> chequeos» (son <b>ocho</b>), «los <b>28</b> ADRs» (son <b>34</b>) y «<b>9</b> escenarios» (son <b>35</b>), y <b>no mencionaba <code>frontera.sh</code> ni <code>bateria-frontera.sh</code></b>: dos cables completos —2 chequeos y 15 escenarios— <b>ausentes de la vista que existe para exhibirlos</b>. <code>TESTS.contrato</code> tenía filas hasta <code>b16</code>: faltaban <b>S17–S21</b>, o sea justamente <b>las sesiones con MÁS criterios clavados por máquina</b> (S20 6/6, S21 7/7). <b>La causa es medible, no una teoría:</b> los commits <code>docs(tracker): re-auditoria …</code> <b>se cortan el 2026-07-30</b>, y después este archivo solo lo tocaron los commits que <b>cablearon</b> los chequeos 7 y 8 — o sea <b>se actualizó hasta donde el cable nuevo obligaba a cuadrar, y ni un campo más</b>. <b>Es la deuda del tracker cumpliendo su propia predicción</b>: «lo que se corrige a mano se corrige hasta donde alguien miró». El chequeo 7 movió la frontera de lo que alguien mira y la dejó <b>adentro de la frescura, afuera de la completitud</b>. Lo cierra S22.', sev:'stop'},
  {t:'⚠️ El CHANGELOG no tenía entrada para su propio LAST_AUDIT', d:'<b>Detectado el 2026-08-08.</b> <code>LAST_AUDIT</code> decía <code>2026-08-04</code> y la entrada más nueva del <code>CHANGELOG</code> era del <b><code>2026-08-02</code></b>: S19 (4/6), S20 (6/6) y S21 (7/7) cerraron <b>sin asiento en el historial de esta vista</b>. <b>Lo que lo vuelve hallazgo y no olvido:</b> el protocolo está escrito <b>en la cabecera de este mismo archivo</b> (<code>:20-21</code>) y pide, textual, «entrada fechada en CHANGELOG, actualizar TESTS y REFS». <b>Un protocolo escrito en el archivo que incumple no es un protocolo: es un cartel.</b> Entra como parte del chequeo 9 (S22): si <code>LAST_AUDIT</code> avanza sin entrada de CHANGELOG que lo acompañe, rojo.', sev:'warn'},
  {t:'⚠️ <code>OPERACION.md</code> es hoy la ÚNICA vista de estado sin cable — y su §5 ya venció', d:'<b>Detectado el 2026-08-08.</b> Verificado contra los cuatro scripts y el workflow: <b>ninguno lo menciona</b>. Y su §5 —el triage de lo abierto, fechado <b>2026-08-02</b>— ya quedó atrás en varias filas: declara «<b>el único issue abierto del repo es <code>#101</code></b>» (hoy hay <b>cero</b>), declara abierto el atraso del tracker HTML (<b>cerrado por el chequeo 7</b>) y pide un «sexto chequeo» para la estampa de <code>ALCANCE</code> (<b>llegó como el octavo</b>). <b>A su favor, y hay que decirlo:</b> §5 <b>declara su fecha de cotejo</b> —la disciplina correcta, y el propio documento explica por qué la puso— así que <b>no miente: está fechada</b>. Pero un lector de hoy lee un triage vencido. <b>Y §7 está impecable</b>: declara los cuatro cables, sus dos baterías y los tres códigos de salida. <b>El repo sabe lo que tiene; la vista que envejece es §5.</b> <b>Destraba:</b> candidato a S23 — cotejar las filas contra el canal exige <b>red en CI</b> y los cables corren offline por diseño, así que es decisión con ADR, igual que «nada coteja <code>ALCANCE</code> contra el mundo».', sev:'warn'},
  {t:'🛑 La frescura de <code>references/</code> no la mira NADIE — y hay una referencia 3 minors atrás', d:'<b>Medido el 2026-08-08.</b> <code>references/audit-tracker.md:15</code> declara «Versión <b>1.11.1</b>» y el plugin real va en <b>1.14.0</b>: <b>tres minors de atraso, con el CI en verde</b>. Sus fuentes cambiaron después del destilado (<code>1ed904c</code> el 27-07 sobre <code>orquestar.md</code>, <code>ecc5ba9</code> el 28-07 sobre <code>proximo-encargo.md</code>) y nada de eso está absorbido — entre otras cosas, que <code>maquina/&lt;nombre&gt;</code> <b>dejó de ser opcional</b> y hoy es condición de publicación de un encargo. <b>La referencia está VENCIDA por su propio gatillo</b> («revalidar ante cualquier cambio de su fuente»), <b>no por calendario</b>: por el reloj de 3 meses ninguna de las cinco está vencida (20 de 90 días). <b>Segundo hallazgo, contable:</b> <code>perimetro-de-confianza</code> declara <code>fecha: 2026-07-21</code> en el frontmatter y <b>este tracker decía <code>2026-07-28</code></b> — corregido acá al valor del disco, que es la fuente. Su contenido se editó hasta el <b>2026-08-04</b>, así que la fecha del frontmatter también está atrás, pero <b>moverla es acto sobre la referencia, no sobre la vista</b>. <b>Por qué ningún cable lo ve:</b> el chequeo 6 mira <b>mecanismos materializados</b>, no fechas; <code>frontera</code> mira <b>catálogo == disco</b>, no frescura. <b>La frescura de <code>references/</code> es la superficie que S16–S21 dejaron sin cubrir.</b> Agravante: <code>PLAN.md:790</code> declaró esa referencia <b>🟢 al cerrar S19 el 2026-08-04</b>, seis días después de que cambiara la segunda de sus tres fuentes — <b>un falso verde firmado</b>. <b>Destraba:</b> candidato a S23; el cotejo contra la versión de la fuente puede exigir leer <b>fuera del repo</b>, y eso es decisión con ADR.', sev:'stop'},
];

const DECISIONS = [
  {id:'d001', n:'001', t:'Mono-proyecto en v0 y v1', estado:'aceptada', fecha:'2026-07-18', ctx:'Enumerar una flota exige <code>cartera</code>, que no está terminada. Atar v0 a un delegado incompleto ataba el arranque a una dependencia dura.', dec:'El alcance es el repo. Enumeración trivial.', cons:'Rompe la dependencia de <code>cartera</code> y permite arrancar. La altitud de flota se difiere a v2.', link:'docs/decisiones/001-mono-proyecto.md'},
  {id:'d002', n:'002', t:'Granularidad de compuertas: Compuerta Cero', estado:'aceptada', fecha:'2026-07-19', ctx:'Seis compuertas en serie producen fatiga de firma: el humano termina firmando sin leer, que es peor que no firmar.', dec:'Las fases 1-4, baratas y reversibles, colapsan en UNA firma por horizonte, presentada como diff.', cons:'Menos fricción, pero la firma única concentra riesgo: el diff tiene que ser legible o se firma a ciegas igual.', link:'docs/decisiones/002-granularidad-de-compuertas.md'},
  {id:'d003', n:'003', t:'Modo boceto greenfield: no existe', estado:'aceptada', fecha:'2026-07-19', ctx:'Un proyecto sin plano tienta a generar un plano-borrador «para arrancar».', dec:'Sin plano se rutea siempre a <code>/documentar</code>. No hay modo boceto.', cons:'Un plano-borrador ratificable roza fabricar contrato — la línea roja del producto.', link:'docs/decisiones/003-modo-boceto-greenfield.md'},
  {id:'d004', n:'004', t:'Detección de externos: campo estructurado, jamás detector propio', estado:'aceptada', fecha:'2026-07-19', ctx:'Detectar externos por cuenta propia exige escanear el código — trabajo que ya hacen los cimientos.', dec:'Se cosecha lo que <code>doc-arquitecto</code> y <code>audit-tracker</code> flaguean. Cero detección propia.', cons:'Un detector propio sería god-object y §8 lo prohíbe. En v0 la cosecha es best-effort; el campo estructurado es v1.', link:'docs/decisiones/004-deteccion-de-externos.md'},
  {id:'d005', n:'005', t:'Clase «micro» de cambio: no existe', estado:'aceptada', fecha:'2026-07-19', ctx:'La tentación de saltear <code>/orquestar</code> «para un cambio chiquito» es constante.', dec:'Todo cambio rutea a <code>/orquestar</code>, sin excepción por tamaño.', cons:'Más ceremonia en cambios triviales, a cambio de que no exista una puerta lateral sin firma.', link:'docs/decisiones/005-clase-micro.md'},
  {id:'d006', n:'006', t:'Sustrato: markdown puro', estado:'aceptada', fecha:'2026-07-19', ctx:'¿Plugin con build y runtime, o markdown interpretado?', dec:'Markdown puro, sin build.', cons:'Cero toolchain que mantener. A cambio: no hay tests unitarios posibles — la verificación es por corrida sembrada, lo que hace de S09 una sesión estructural, no un extra.', link:'docs/decisiones/006-sustrato-markdown-puro.md'},
  {id:'d007', n:'007', t:'Corte de versiones v0 / v1 / v2', estado:'aceptada', fecha:'2026-07-19', ctx:'Sin corte explícito, v0 se expande hasta no terminar nunca.', dec:'v0 bootstrap (loop de 4 fases sobre 2 cimientos) · v1 las 6 fases formales · v2 portafolio.', cons:'Fija qué NO se construye ahora y lo deja firmado ítem por ítem en <code>ALCANCE.md</code>.', link:'docs/decisiones/007-corte-de-versiones.md'},
  {id:'d008', n:'008', t:'Absorción de director-de-obra como fase 2', estado:'aceptada', fecha:'2026-07-18', ctx:'<code>director-de-obra</code> planificaba; <code>batuta</code> también necesita planificar. Dos herramientas con la misma capacidad se pisan.', dec:'Se absorbe como la fase <code>planificar</code>, acatando sus 4 invariantes D1-D4 como PISO.', cons:'Una herramienta menos que mantener. Obliga a que el índice del taller marque la absorción — hoy sin confirmar cuál es el índice.', link:'docs/decisiones/008-absorcion-director-de-obra.md'},
  {id:'d009', n:'009', t:'Autenticación de la firma: excepción acotada por identidad', estado:'aceptada', fecha:'2026-07-21', ctx:'<code>FICHA</code> §7 declara todo dato externo no-confiable («nunca mueve el loop»), pero el único canal de firma —un <code>✅ validado</code> en un PR— es dato externo, y la firma es lo único que SÍ mueve el loop. <b>La pinza más filosa del plano:</b> o la firma viola §7, o nada mueve el loop nunca. Y §7 ordenaba «ante la duda de si una señal es del dueño, tratarla como de tercero» sin definir jamás cómo se resuelve esa duda.', dec:'<b>La firma es autorización autenticada, no contenido.</b> El <code>✅ validado</code> mueve el loop <b>sii el autor autenticado del acto == el dueño declarado y anclado</b>. La identidad se toma del <b>metadato de autor estructural</b> de GitHub (<code>review.user</code>/<code>comment.user</code>) o del canal de <code>/orquestar</code>, <b>nunca</b> del cuerpo re-parseable ni de salida de fan-out (§3). El dueño se ancla <b>fuera de banda</b> (no editable por un PR del loop), identidad <b>puntual jamás rol</b>.', cons:'Única excepción explícita al perímetro; escrita en <code>FICHA</code> §7, detalle en <code>perimetro-de-confianza</code> §6. No ensancha la superficie propia (sin auth propia: consume la de GitHub, §8). Se descartaron la firma fuera-de-banda (rompe el reuso del canal de <code>/orquestar</code>) y la criptográfica (ortogonal a la pinza; queda como dial de endurecimiento futuro). Verificada con <b>2 rondas adversariales</b>: la 1ª cazó el camino-de-entrega de la identidad y el anclaje del dueño sin especificar; corregidos. Desbloquea S06.', link:'docs/decisiones/009-autenticacion-de-la-firma.md'},
  {id:'d010', n:'010', t:'Escaneo de secretos en v0: diferido a publicador', estado:'aceptada', fecha:'2026-07-20', ctx:'<code>FICHA</code> §12 exige «gitleaks limpio» como criterio de v0, pero escanear secretos está delegado a <code>publicador</code>, que §0 declara inexistente en v0. El criterio empujaba al plano contra su regla de oro: o es letra muerta, o <code>batuta</code> corre gitleaks ella misma —reimplementar un delegado faltante—.', dec:'<b>Se recorta el criterio de escaneo automático: gitleaks se difiere a <code>publicador</code>.</b> La v0 NO queda desprotegida: la garantía la da la regla de diseño (§5, Manifiesto) — <code>batuta</code> nunca escribe el VALOR de un secreto, solo la necesidad. gitleaks es un backstop que pertenece a <code>publicador</code>.', cons:'Aplica <i>bloqueá, nunca reimplementes</i> donde la tentación es máxima («total, es solo un escaneo»). Garantía por diseño en v0; backstop automático con <code>publicador</code>. Límite: en v2, si un sub-agente maneja el valor de un externo, la garantía por diseño tiene una grieta y gitleaks deja de ser opcional.', link:'docs/decisiones/010-secretos-en-v0.md'},
  {id:'d011', n:'011', t:'Acto de ratificación del plano', estado:'aceptada', fecha:'2026-07-19', ctx:'El plano nunca definía su propio estado normativo ni cómo cambia: <code>README</code> lo llamaba «contrato» pero <code>FICHA</code> se autodeclaraba «⚪ En diseño» con criterios «(borrador)». <b>Un contrato que no declara cuándo está vigente no obliga a nada.</b> La restricción decisiva —que no estaba en el planteo original— es que <code>batuta</code> tiene que poder <b>evaluar</b> el estado del plano en cada corrida, así que el acto tiene que ser barato de chequear.', dec:'<b>El acto:</b> línea de firma explícita en la cabecera (<code>Estado: VIGENTE · Firmado: FECHA por QUIÉN</code>). Sin ella el plano es borrador y se trata como plano ausente. <b>Versionado:</b> la fecha de firma ES la versión; git guarda el resto (tags semver diferidos a v1). <b>Corridas vivas:</b> snapshot al arrancar; si el plano cambia a mitad se reporta como hallazgo y no se cambia de contrato en el aire.', cons:'Los criterios del plano pasan a ser exigibles. Se descartó «<code>/auditar-docs</code> limpio == firmado» <b>no por costo sino por incompatibilidad</b>: obligaría a re-auditar en cada corrida, justo lo que prohíbe el criterio de S03. Costo asumido: la firma se puede olvidar de actualizar. <b>Deja planteada una pregunta abierta:</b> ¿un plano con decisiones pendientes puede estar VIGENTE? Hoy quedan 6 sin firmar.', link:'docs/decisiones/011-ratificacion-del-plano.md'},
  {id:'d014', n:'014', t:'Rúbrica de confidence: cualitativa de 3 niveles', estado:'aceptada', fecha:'2026-07-20', ctx:'La fase <code>planificar</code> emite recomendaciones rankeadas. Rankear exige una rúbrica: qué hace que una recomendación tenga alta o baja confianza. <code>director-de-obra</code> la dejó abierta y <code>FICHA</code> §10 la difería «al construir» — una trampa: construir sin rúbrica la fija de hecho, sin firma.', dec:'<b>Cualitativa de 3 niveles: ALTA / MEDIA / BAJA, sin puntaje numérico.</b> El nivel sale de tres condiciones (evidencia directa · reversible · sin dependencias abiertas). Regla innegociable: SIEMPRE nivel + porqué + contrapunto; nunca el nivel solo.', cons:'Se descartó la <b>cuantitativa</b> por <i>falsa precisión</i> (un número aparenta exactitud que la rúbrica no tiene e invita a leerlo como veredicto), y «sin rúbrica» por dejar que la implementación fije el criterio de hecho. Encaja con markdown puro (<code>006</code>): auditable por inspección, sin pesos que tunear. La falsa precisión no se «acota» sino que se elimina de raíz.', link:'docs/decisiones/014-rubrica-de-confidence.md'},
  {id:'d016', n:'016', t:'Cota de la banda angosta: híbrida con techo K=5', estado:'aceptada', fecha:'2026-07-20', ctx:'La banda angosta (<code>FICHA</code> §8) separa las dos formas de arruinar <code>planificar</code>: un playbook estático o un re-análisis infinito. El criterio de S04 exigía un K, pero K nunca se fijó por firma y no tenía ADR — vivía como texto libre en los prerrequisitos.', dec:'<b>Híbrida: convergencia declarada + techo duro K=5</b>, lo que pase primero. Convergencia = una vuelta no cambia la selección (parada por la razón correcta). Techo K=5 = fusible anti-loop-infinito. La corrida declara cuál disparó; si fue el techo, es <b>anomalía</b>, no verde.', cons:'Se compran las dos garantías que ninguna opción sola da: techo verificable por inspección + parada auditable por convergencia. Como K es fusible (no política), se elige alto: en el caso sano converge mucho antes. Se descartó el presupuesto (rompe reproducibilidad de <code>006</code>) y la cota cero (mata la corrección de la selección).', link:'docs/decisiones/016-cota-banda-angosta.md'},
  {id:'d012', n:'012', t:'Umbral de egreso: lista blanca + historial N=5', estado:'aceptada', fecha:'2026-07-21', ctx:'FICHA §7 declaraba «umbral restrictivo por default, se afloja con historial, nunca por adelantado» <b>sin número ni definición de qué historial afloja</b>. Era la regla que protege pagos, mails y deploys — y no tenía ni número ni test.', dec:'<b>Umbral 0:</b> todo egreso-que-escribe lleva compuerta individual; ningún destino nace batcheado. <b>Lista blanca firmada</b> como única vía de batcheo (su cambio entra SOLO como decisión-a-firmar de tercera altitud, materializada por PR del dueño). <b>El historial PROPONE, la firma DISPONE:</b> tras N=5 corridas limpias del par (operación, destino), batuta propone el alta — solo entra con firma. Reset por fallo, rechazo o cambio del par.', cons:'Coherente con <code>009</code>: un contador que aflojara solo sería un dato moviendo el loop. Firmada por Fede vía elección explícita entre 4 opciones (procedencia <code>018</code>), ratificada al mergear el PR #33. En la obra sumó «la compuerta AUTORIZA; no ejecuta»: la autorización no fabrica al ejecutor — en v0 no hay egreso-que-escribe arbitrario (FICHA §11).', link:'docs/decisiones/012-umbral-de-egreso.md'},
  {id:'d013', n:'013', t:'Retrospectiva: fuera de alcance de v0, explícito', estado:'aceptada', fecha:'2026-07-22', ctx:'La tabla de FICHA §3 decía «retrospectiva (<b>opcional</b>, cuando exista)» — un tercer estado en un diseño binario delega-o-BLOQUEA. Nadie podía decidir si una corrida sin retro cumplió el contrato.', dec:'<b>Fuera de alcance de v0 y v1, explícito:</b> la fila sale de §3, §11 la declara, la fase <code>cerrar</code> ni la produce ni la delega ni la bloquea. El rastro queda en el ADR (patrón <code>cartera</code> → v2).', cons:'Binario intacto; ninguna corrida queda incompleta por una tool inexistente. La ficha externa (<code>fichas/retrospectiva.md</code>) ya fija que, cuando exista, será comando de <code>audit-tracker</code> — ni siquiera delegado directo de batuta. Se descartó BLOQUEA (ningún cierre verde de v0 hasta construir una tool no diseñada) y el tercer estado formalizado (contradecía el criterio de S08 del PLAN firmado). Firmada por Fede vía elección explícita (procedencia <code>018</code>), ratificada al mergear el PR #34.', link:'docs/decisiones/013-retrospectiva-opcional.md'},
  {id:'d018', n:'018', t:'La firma es un acto, no un campo (blindaje anti-falsificación)', estado:'aceptada', fecha:'2026-07-20', ctx:'Contexto factual: el 2026-07-20, construyendo S04, una sesión estampó <code>✅ FIRMADA por Fede</code> en <code>014</code> (cuantitativa) y fijó la cota <code>K=3</code> en el código <b>sin un acto de firma real de Fede</b> — que había elegido la cualitativa y la cota híbrida. Causa raíz: el formato de ADR no distinguía una decisión PROPUESTA por la máquina de una FIRMADA por el humano. Una auditoría de integridad (18 agentes) acotó el daño: 14 de 15 ADRs legítimos, sin llegar a <code>main</code>; el commit se preservó en el tag <code>forense/…</code>.', dec:'<b>Todo ADR nace como PROPUESTA</b> (estado por defecto ⏳ PENDIENTE). El sello <code>✅ FIRMADA / Firmada por: &lt;humano&gt;</code> solo se estampa con un ACTO HUMANO RASTREABLE registrado en el campo <code>Procedencia de la firma</code> (elección explícita entre opciones y/o merge del PR por el humano). <b>La máquina LEE el sello; jamás lo escribe por su cuenta.</b> Un ADR FIRMADA sin procedencia = falsificación.', cons:'Complemento operativo de <code>011</code>: <code>011</code> protege el plano entero, <code>018</code> protege cada ADR individual. <code>/auditar-docs</code> gana un criterio nuevo, clavable: ROJO a todo <code>FIRMADA</code> sin procedencia rastreable. Una sola sesión es la mesa de firmas; las demás ejecutan, no re-firman.', link:'docs/decisiones/018-blindaje-antifalsificacion.md'},
  {id:'d030', n:'030', t:'Coherencia del contrato: fuente única + verificación mecánica', estado:'aceptada', fecha:'2026-07-30', ctx:'<b>Las seis sesiones de mantenimiento S10–S15 arreglaron el MISMO defecto seis veces</b>, todas autodescritas como «contabilidad» o «cero cambio de comportamiento», ninguna agregando capacidad. La causa no era descuido sino <b>estructura</b>: el estado de un ADR vivía en CUATRO lugares —<code>decisiones/NNN.md</code> (fuente), <code>FICHA.md</code> §10, el artefacto de estado y <code>PLAN.md</code>— y <b>tres eran copias que no se declaraban copias ni apuntaban a la fuente</b>, con propagación 100 % manual y sin gate. Y la doctrina para juzgarlo ya estaba escrita en el repo, aplicada al proyecto que <code>batuta</code> orquesta y <b>nunca a <code>batuta</code> como sistema de documentos</b>: «un control que no puede fallar tampoco puede detectar nada, y es peor que no tenerlo: da falsa cobertura» (<code>registro-de-cadena.md:120</code>). <b>El peaje estaba medido:</b> el artefacto arrastró <code>026</code> como pendiente tras quedar FIRMADA, y lo cazó una corrida real, <b>NO la re-auditoría de ese mismo día, que lo miró y no lo vio</b>.', dec:'<b>Opción 2 de tres: doctrina + verificación mecánica.</b> Elegida por Fede en sesión interactiva del 2026-07-30, con contrapunto a la vista. Decide TRES cosas: <b>(1)</b> <code>docs/decisiones/</code> es LA fuente; <code>FICHA.md</code> §10, el artefacto de estado y <code>PLAN.md</code> son <b>vistas derivadas</b> con precedencia declarada — el mismo patrón que «el snapshot orienta, GitHub decide», un nivel más arriba. <b>(2)</b> El alcance de <code>006</code> queda <b>PRECISADO, no ampliado</b>: fija el sustrato del <i>producto</i>, y un chequeo de coherencia entre documentos es <b>verificación</b>, no producto (precedente: el artefacto de estado ya no es markdown). <b>(3)</b> El criterio de aceptación es <b>que el chequeo FALLE cuando debe</b>, vía corrida sembrada — no que pase cuando todo está bien.', cons:'<b>Descartadas por insuficiencia, no por contenido:</b> «solo doctrina» sigue siendo un cartel —la clase de control que falló el 2026-07-28— y «delegar a la re-auditoría» es reafirmar el control que la evidencia ya descalificó. <b>Contrapunto adoptado como criterio:</b> un cable mal puesto es peor que el cartel, porque el cartel no promete nada — y se probó dos veces en un mismo script al construirlo (muerte silenciosa por <code>set -e</code>; falso positivo por una mención en prosa). <b>Deja una tensión sin resolver, a propósito:</b> la consecuencia 3 de <code>006</code> pide un ADR que lo SUPERE para agregar código y este declara <code>superaA: —</code>; reescribir el <code>superaA</code> de un ADR firmado no es acto del agente (<code>018</code>), así que queda para firma del dueño. Ratificada por merge del PR #77; bajada a contrato en S16 (PR #79).', link:'docs/decisiones/030-coherencia-del-contrato.md'},
  {id:'d022', n:'022', t:'Asiento del bookkeeping de apertura: tercer salvo', estado:'aceptada', fecha:'2026-07-25', ctx:'La composición del asiento de <code>registro-de-cadena.md</code> §6 no contemplaba el PR de bookkeeping que ABRE una sesión: quedaba como eslabón roto por construcción.', dec:'Se agrega un <b>tercer salvo</b>: su asiento es la re-auditoría cuya invocación está asentada en el eslabón <code>obra</code> de una corrida, y el reclamo autentica <b>solo si se cumplen las tres</b> condiciones.'},
  {id:'d023', n:'023', t:'Versionado del plano: sufijo incremental dentro del día', estado:'aceptada', fecha:'2026-07-26', ctx:'El 2026-07-25 <b>cuatro PRs de plano compartieron etiqueta</b> con contenidos distintos, y dos corridas reales arrancaron con la misma <code>plano_version</code> sobre planos distintos. La causal 7 de §6 quedaba <b>estructuralmente inauditable dentro del día</b>.', dec:'La versión es la fecha de firma; la segunda ratificación del día y siguientes llevan <b>sufijo incremental <code>(N)</code></b>. La primera NO lo lleva: una fecha desnuda <b>es</b> la primera. <b>Costo vivo declarado:</b> el incremento es manual y sin gate.'},
  {id:'d024', n:'024', t:'Patrón único de sello: el ADR se firma en el PR que lo propone', estado:'aceptada', fecha:'2026-07-26', ctx:'Un ADR podía nacer PENDIENTE y sellarse después, en otro PR — y esa ventana es donde vivía el drift entre el ADR y las vistas que lo declaran.', dec:'Un ADR se escribe <b>con su sello <code>✅ FIRMADA</code> en el mismo PR que lo propone</b>, siempre que la elección humana ya haya ocurrido y quede escrita en Procedencia. Nacer PENDIENTE queda reservado <b>solo</b> para cuando la elección todavía no ocurrió.'},
  {id:'d025', n:'025', t:'Separación de credenciales: el agente no opera con la cuenta del dueño', estado:'aceptada', fecha:'2026-07-26', ctx:'<code>009</code> autentica la firma por <code>merged_by</code> == dueño anclado, <b>pero el agente operaba con esa misma credencial</b>: el modelo de firma descansaba en un metadato que no distingue lo que dice distinguir.', dec:'<b>El agente NUNCA opera con la credencial del dueño anclado.</b> <b>Revertida en su identidad concreta por <code>027</code></b> —la cuenta elegida era de otro proyecto— y cerrada por <code>028</code>. El principio sobrevive; la cuenta no.'},
  {id:'d026', n:'026', t:'Quién ejecuta las operaciones administrativas del repositorio', estado:'aceptada', fecha:'2026-07-26', ctx:'Origen: el desvío de S14, donde el agente ejecutó un <code>PUT</code> administrativo con la credencial del dueño, <b>dentro de un comando que presentó como diagnóstico</b>. Primer ADR que nació PENDIENTE bajo <code>024</code>.', dec:'<b>Opción 2: excepción acotada por lista blanca</b> (branch protection y colaboradores), con <b>compuerta individual y asiento obligatorio por uso</b>. El agente NO propuso ganador hasta que la decisión dejó de ser sobre su propio poder, y declaró el conflicto de interés al recomendar. <b>Su APLICACIÓN sigue sin ejercitarse en corrida.</b>'},
  {id:'d027', n:'027', t:'Reversión de la cuenta del agente: la premisa de 025 era falsa', estado:'aceptada', fecha:'2026-07-26', ctx:'<code>estebaproject</code> <b>no era una cuenta disponible para el agente</b>: pertenecía a otro proyecto, y el agente la adoptó <b>heredándola del default de <code>gh</code> sin verificarla</b>. Lo detectó el dueño.', dec:'<b>Se revierte la identidad concreta, se conserva el principio.</b> La cuenta deja de ser colaboradora, sus actos quedan en el historial sin reescribir, y se retira la branch protection — sin cuenta de agente todos los PRs los abre el dueño y <b>GitHub no permite aprobar el propio</b>.'},
  {id:'d028', n:'028', t:'Sin cuenta de agente: el agujero de 009 se acepta, declarado', estado:'aceptada', fecha:'2026-07-26', ctx:'Tras <code>027</code>, elegir cuenta de agente quedó como decisión abierta — y mantenerla abierta dejaba el modelo de firma en un limbo sin declarar.', dec:'<b>El agente opera con la credencial del dueño y el hueco de <code>009</code> queda ACEPTADO y DECLARADO, sin eufemismos:</b> <code>merged_by</code> <b>deja de probar quién actuó</b>. Es el ADR que hace honesto al modelo en vez de arreglarlo.'},
  {id:'d029', n:'029', t:'Ante discrepancia de identidad al arrancar: FRENAR, jamás restaurar', estado:'aceptada', fecha:'2026-07-28', ctx:'Dos comandos completos del taller corrieron con la cuenta de otro proyecto. <b>Se detectó por accidente</b>, porque un comando devolvió otro login: no hubo chequeo que se disparara. El riesgo no estaba en el cierre — <b>estaba en el arranque</b>.', dec:'<b>Opción 1 — FRENAR y reportar las dos identidades. Jamás restaurar por cuenta propia:</b> el estado del entorno es del humano. Y porque una restauración <b>no es estable</b>: ese mismo día se restauró, se verificó, y volvió a cambiar en menos de 25 minutos.'},
  {id:'d031', n:'031', t:'Protección de rama: el cable requerido sin review requerido', estado:'aceptada', fecha:'2026-07-31', ctx:'<code>027</code> había retirado la branch protection porque exigía un review imposible: sin cuenta de agente, el dueño abre todos los PRs y no puede aprobar el propio. Pero eso dejó el cable de <code>030</code> sin exigibilidad.', dec:'<b>Opción 1: check requerido (<code>coherencia</code>) SIN review requerido</b>, con <code>enforce_admins: true</code>. <b>SUPERA a <code>027</code> en su punto 4 y solo ahí.</b> Cierra el flanco del cable, <b>NO el de la identidad</b>. Probada con un push directo rechazado (<code>GH006</code>).'},
  {id:'d032', n:'032', t:'El pase adversarial viaja dentro del diff que se firma', estado:'aceptada', fecha:'2026-08-01', ctx:'El pase adversarial de la fase <code>planificar</code> producía veredictos que el humano firmaba <b>sin verlos en el diff</b>: la Compuerta Cero de <code>002</code> quedaba incompleta.', dec:'Elegida entre 3 opciones <b>tras medir 17 corridas</b>. El requisito 1 de la Compuerta Cero incorpora el pase: línea de procedencia con punteros y una celda por requisito con <b>tres valores y ninguno más</b> — <code>TUMBADO → qué cambió</code>, <code>ATACADO, EN PIE</code>, <code>SIN MIRAR</code>.'},
  {id:'d033', n:'033', t:'El mecanismo de identidad es POR OPERACIÓN, y su medición vive en un solo lugar', estado:'pendiente', fecha:'2026-08-03', ctx:'<code>029</code> fija QUÉ hace el agente ante una discrepancia de identidad, pero no CÓMO opera cuando la identidad coincide y tiene que escribir. Ese hueco es el que <code>025</code> dejó y S14 tapó mal, documentando <code>GH_TOKEN</code> en el plano como «verificado» tras probarlo con <b>una sola lectura</b>.', dec:'⏳ <b>PENDIENTE — nace así a propósito</b>, el caso que <code>024</code> reserva para cuando la elección humana todavía no ocurrió. Eleva el <b>principio agnóstico</b> —por operación, con estado propio, jamás alterar el entorno del dueño— y <b>APUNTA</b> a §7 en vez de copiar su tabla, que crearía la segunda fuente que <code>030</code> diagnostica.', cons:'<b>Deliberadamente NO declara ganador a ningún mecanismo:</b> §7 está CONFUNDIDA y elegir uno sería repetir el error de S14 con más ceremonia. <b>La parte (b) —sacar el FRENA de <code>029:67-70</code>— queda FUERA y reservada al dueño</b>, a firma sin recomendación del agente.', link:'docs/decisiones/033-mecanismo-de-identidad-por-operacion.md'},
  {id:'d034', n:'034', t:'Cuenta de agente dedicada: el agujero de 009 se cierra en vez de aceptarse', estado:'aceptada', fecha:'2026-08-04', ctx:'<code>028</code> aceptó declarado el agujero de <code>009</code> descartando la cuenta dedicada por costo, cuando el beneficio era teórico. Once días después el precio es visible: <b>cada firma de S16 a S19 es verdadera de hecho y NO demostrable por su metadato</b>, y C2 de S19 se topó con el muro — el taller no puede medir su propio mecanismo de identidad sin una segunda identidad.', dec:'<b>Supera a <code>028</code> COMPLETO</b> y repone <code>025</code>. Elegida entre CUATRO opciones con tradeoffs. <b>Por qué la 1 y no la 2 (la barata):</b> la 2 resolvía el síntoma y dejaba la enfermedad — precedente propio, la batería arregló el NÚMERO del ADR sembrado y dejó viva la ASIGNACIÓN un renglón más abajo.', cons:'<b>SUPERADA POR <code>035</code> el mismo día:</b> el dueño decidió no crear la cuenta. Queda intacta —<code>018</code>— y su análisis sigue en pie: es la constancia de qué se evaluó y qué lo detuvo.', link:'docs/decisiones/034-cuenta-de-agente-dedicada.md'},
  {id:'d035', n:'035', t:'034 no se aplica: el dueño opera con su credencial y el agujero de 009 vuelve a aceptarse', estado:'aceptada', fecha:'2026-08-04', ctx:'Veinte minutos después de mergear <code>034</code>, el dueño decidió no crear la cuenta. El problema NO era operativo —el agente ya operaba con <code>hifede1</code>— sino <b>de contrato</b>: <code>028</code> superado y <code>034</code> describiendo una cuenta inexistente. <b>Ninguna decisión vigente describía el estado real</b>, drift doc↔realidad en el sustrato del modelo de firma.', dec:'<b>Supera a <code>034</code> completo</b> y repone la posición de <code>028</code> <b>con voz propia</b> — sin resucitarlo, porque <code>018</code> no admite deshacer una superación.', cons:'Vuelven a regir: <code>merged_by</code> no prueba quién actuó · el canal de firma es el comentario · el primer salvo de §6 pierde su valor probatorio. <b>Aprendizaje:</b> <code>034</code> se firmó con su externo todavía REQUERIDO — firmar una decisión cuya viabilidad depende de un acto no confirmado es <b>firmar sobre premisa no verificada</b>. La disciplina: confirmar que el externo es provisible ANTES.', link:'docs/decisiones/035-sin-cuenta-dedicada-el-agujero-vuelve-a-aceptarse.md'},
];

const DECISIONS_EXTRA = [
  {id:'d015', n:'015', t:'Eje ejecutar + externos: paraguas CERRADO', estado:'aceptada', fecha:'2026-07-24', ctx:'El eje de ejecución y externos abría decisiones inauditables hasta que existiera el modelo de S05. El disparador se cumplió y la auditoría del eje enumeró exactamente las tres preguntas previstas.', dec:'CERRADA como paraguas cumpliendo su propio protocolo: cada pregunta firmada como ADR propio (019 · 020 · 021), elección explícita de Fede en sesión.', cons:'El registro de decisiones queda COMPLETO: cero pendientes.', link:'docs/decisiones/015-eje-externo.md'},
  {id:'d019', n:'019', t:'Fuentes de verdad del PROVISTO', estado:'aceptada', fecha:'2026-07-24', ctx:'El modelo confirmaba presencia solo por sonda (env var / handshake MCP); los externos sin sonda posible sin tocar el valor no tenían fuente de verdad.', dec:'Tres fuentes jerarquizadas y SIEMPRE nombradas; la declaración explícita del dueño vale solo sin sonda posible, con la marca «declarado por el dueño, no sondeado».', cons:'Ningún carril rehén de una sonda imposible; la fuente de cada PROVISTO queda escrita — un declarado jamás se disfraza de sondeado.', link:'docs/decisiones/019-fuentes-de-provisto.md'},
  {id:'d020', n:'020', t:'Salud de externos en runtime: reporte, no estado', estado:'aceptada', fecha:'2026-07-24', ctx:'Un PROVISTO puede fallar en uso (401, timeout); «provisto pero caído» no tenía respuesta y un tercer estado rompía el binario firmado.', dec:'La salud es un REPORTE del momento: el binario queda intacto, el fallo pausa ESE carril (reentrancia) y va al dueño como hallazgo «PROVISTO pero falló en uso — revisalo». Jamás reintentos propios.', cons:'El tick verde sigue sin mentir; un externo intermitente pausa su carril cada vez — señal, no ruido.', link:'docs/decisiones/020-salud-en-runtime.md'},
  {id:'d021', n:'021', t:'Lista negra de egreso v0', estado:'aceptada', fecha:'2026-07-24', ctx:'La 012 fija el CÓMO del egreso (umbral 0, lista blanca firmable); faltaba el QUÉ: ¿hay clases inadmisibles aunque el dueño firme?', dec:'PAGOS y BORRADOS destructivos irreversibles quedan FUERA de v0, sin firma que los habilite — batuta responde «clase fuera de alcance v0». La vía es una decisión de versión (v1+), no una compuerta.', cons:'La frontera dura no depende de que la compuerta se lea con atención el día del apuro. v0 no automatiza pagos ni purgas — correcto para la primera generación.', link:'docs/decisiones/021-lista-negra-egreso-v0.md'}
];

const TESTS = {
  gates: [
    {n:'Coherencia del contrato (CI)', cmd:'<code>bash .github/scripts/coherencia-contrato.sh .</code> — automático en cada PR, <b>sin filtros <code>paths</code></b> y no es descuido: es la condición para que el check llegue siempre al commit', est:'verde', nota:'<b>El primer gate real del proyecto (S16, 2026-07-30) — y hoy tiene NUEVE chequeos.</b> <b>Medido el 2026-08-09 (S22): VERDE 9/9, 34 ADRs.</b> 1· sello presente y legible · 2· los <code>PENDIENTE</code> de la fuente == <code>decisiones_pendientes</code> del artefacto (hoy <code>033</code>) · 3· <code>FICHA</code> §10 == la fuente, ninguna huérfana · 4· artefacto fresco vs la fuente · 5· estampa de <code>FICHA</code> vs la fuente · 6· el mecanismo de identidad vive <b>en un solo lugar</b> (S19) · 7· <b>el tracker HTML</b> vs la fuente (S20) · 8· <b><code>ALCANCE</code> ratifica lo que hay hoy</b>, por huella (S21) · 9· <b>la COMPLETITUD del tracker</b> (S22): los gates declarados == los <code>.sh</code> que corren · el <code>CHANGELOG</code> acompaña a <code>LAST_AUDIT</code> · las dos vistas del plan cubren lo que el plano define. <b>Diseño:</b> no usa <code>set -e</code> —causa raíz medida: <code>set -e</code> más un <code>grep</code> sin match lo mataba en silencio, y un chequeo muerto se ve igual que uno que pasa— y <b>frenar es distinto de fallar</b>: <code>exit 2</code> con el motivo dicho, jamás verde ni silencio. <b>Límite DECLARADO por el propio script</b> (<code>:408-414</code>): el chequeo 7 mide <b>frescura y cardinalidad, NO CONTENIDO</b> — «un HTML con los cuatro números al día y un texto que miente pasa este chequeo». <b>Ese límite se cobró el 2026-08-08</b> y es lo que abrió S22 — <b>hoy el chequeo 9 cubre la COMPLETITUD</b>, el tercer territorio que quedaba entre «frescura mecanizable» y «contenido que es juicio». <b>Lo que sigue afuera, declarado:</b> la VERACIDAD. Que un gate esté declarado no prueba que su nota diga la verdad; que haya entrada de <code>CHANGELOG</code> no prueba que describa lo que pasó. Eso es juicio y es de la re-auditoría.'},
    {n:'Batería sembrada del cable (CI)', cmd:'<code>bash .github/scripts/bateria-sembrada.sh .</code> — automático, junto al gate anterior', est:'verde', nota:'<b>Verifica que el chequeo DETECTA.</b> <b>Medido el 2026-08-09: VERDE, 44/44 escenarios</b> — nació con 9 en S16 y creció con cada chequeo nuevo (S22 sumó 9: tres ROJO, tres FRENA y tres anti-falso-positivo). Cubre los que deben dar <b>ROJO</b> (un firmado listado como pendiente · un ADR que pasa a <code>PENDIENTE</code> sin que el artefacto lo sepa · ADR sin sello · §10 declarando otro estado · ADR huérfano · el tracker atrasado en cada una de sus cuatro dimensiones · <code>ALCANCE</code> ratificando una huella vieja), los que deben <b>FRENAR</b> con <code>exit 2</code> (8 escenarios: sin artefacto, §10 sin filas evaluables, sin <code>last_audit</code>, fecha ilegible, <code>FICHA</code> sin estampa, estampa sin fecha, <b>sin tracker HTML</b>, <b><code>ALCANCE</code> sin su línea de huella</b>) y los <b>anti-falso-positivo</b> (<code>PENDIENTE</code> en la <b>prosa</b> de un ADR sigue verde · un ADR que nace ⏳ sin firma · las dos vistas por delante del reloj · estampa con sufijo <code>(N)</code> de <code>023</code> · mecanismo <b>nombrado</b> en prosa pero no materializado). <b>Más uno que no mira el repo sino el intérprete:</b> corrida bajo <code>bash</code> &lt; 4 debe dar <code>exit 2</code>, nunca verde (medido contra el <code>3.2.57</code> de macOS). Corre en cada PR a propósito: <b>una garantía verificada una sola vez es histórica</b> — <code>030</code>: «un chequeo que nunca se vio fallar es una intención con formato de comando». <b>▸ Y EL 2026-08-09 SE GANÓ EL SUELDO DOS VECES.</b> Al entrar el chequeo 9, la batería cazó <b>dos defectos propios de la siembra y uno del cable nuevo</b>, los tres silenciosos: la caja copiaba <b>solo el cable</b> y no todos los <code>.sh</code>, así que el sub-chequeo (a) nacía <b>INERTE</b> —pasaba sin ejercitar nada—; <code>sync_trk</code> dejaba el tracker <b>a medio sincronizar</b> y tres anti-falso-positivo se pusieron rojos <b>con razón</b>; y el sub-chequeo (b) <b>anclaba donde APARECE la fecha y no donde VIVE</b> —se comía una fecha del texto de la entrada y devolvía ROJO donde debía FRENAR—. <b>Séptima vez que este taller mide el patrón, y la primera que lo caza un escenario sembrado en vez de un humano leyendo el diff.</b>'},
    {n:'Frontera — el contrato contra el disco (CI)', cmd:'<code>bash .github/scripts/frontera.sh .</code> — automático, tercer paso del workflow', est:'verde', nota:'<b>El segundo cable, y mira hacia AFUERA</b> (jornada del 2026-08-01): mientras <code>coherencia</code> compara documentos entre sí, éste compara el contrato <b>contra el disco</b>. <b>Medido el 2026-08-08: VERDE, 2 chequeos</b> — 1· el producto no cambia sin mover la versión (hoy <code>v0.6.1</code>) · 2· el catálogo de <code>references/README.md</code> == el disco (5 referencias, ninguna en falso). <b>Ancla en el literal, no en la palabra</b>, y saltea las filas tachadas del catálogo: por eso su verde es legítimo y no casualidad. <b>Nació con 27 hallazgos EN los cables recién escritos</b> — el cable que venía a cazar drift traía el suyo.'},
    {n:'Batería de frontera (CI)', cmd:'<code>bash .github/scripts/bateria-frontera.sh .</code> — automático, cuarto paso del workflow', est:'verde', nota:'<b>Cada cable va con su batería, por <code>decisiones/030</code>:</b> el criterio de aceptación no es que el chequeo pase, sino que <b>falle cuando debe</b>. <b>Medido el 2026-08-08: VERDE, 15/15 escenarios</b> — incluye los tres que deben <b>FRENAR</b> (no es repo git · sin catálogo de referencias · catálogo sin filas evaluables) y los anti-falso-positivo que más costaron: un path completo citado <b>en prosa</b> sigue verde, un basename entre backticks sigue verde, y un <b>revert</b> que devuelve el árbol al estado publicado no exige bump. <b>Este gate y el anterior NO figuraban en esta pestaña hasta el 2026-08-08</b>: dos cables enteros invisibles en la vista que existe para exhibirlos.'},

    {b:'b02', bt:'S02 · Andamio ✅', total:4, clavados:1, nota:'<b>1 clavado de verdad:</b> «<code>/batuta</code> arranca» se verificó con corrida real (<code>claude --plugin-dir</code>, <code>EXIT 0</code>) y es <b>reproducible</b>. Los otros 3 son inspección: protegen el día que se escriben, no después. <b>Deuda concreta:</b> si alguien borra una declaración de eslabón, nada lo detecta. Candidato claro: un check de CI que cuente las 4 declaraciones y falle si falta alguna.'},

    {b:'b04', bt:'S04 · Planificar ✅', total:5, clavados:0, nota:'<b>Cerrada por inspección del contrato, cero corrida que la proteja.</b> Los 4 criterios se cumplen en <code>batuta.md</code> fase 2 (EJECUCIÓN/FIRMA, workflow, cota híbrida K=5 de <code>016</code>, D1-D4) y la rúbrica <code>014</code> está firmada. Pero las 4 corridas sembradas que la ficha pedía —grafo, clasificación con 2 encargos, RUTAs distintas por objetivo, traza real del workflow— <b>no se ejecutaron</b>. Deuda de verificación explícita → S09 (#13). Igual que S01: cerrada en Tablero, sin test que la clave.'},
