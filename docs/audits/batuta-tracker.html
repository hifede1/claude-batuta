    {b:'b06', bt:'S06 · Compuerta Cero ✅', total:5, clavados:0, nota:'Cerrada por inspección + 2 rondas adversariales (PR #31). Las corridas de 2 horizontes con firma quedaron en el <b>techo doctrinal</b>: exigen firmas humanas reales — se clavan en la primera corrida interactiva.'},
    {b:'b07', bt:'S07 · Ejecutar ✅', total:5, clavados:2, nota:'<b>Clavados por corrida real (E4, 2026-07-22):</b> la inyección en ambos niveles (dos venenos detectados, reportados, desobedecidos; el loop siguió) y el umbral 012 firmado con número. <b>Parcial:</b> «cero rama/merge/código de batuta» exhibido en 3 corridas (git limpio ×3). El GET+POST con lista blanca queda en el techo doctrinal (y en v0 el egreso-que-escribe genérico no tiene ejecutor — FICHA §11).'},
    {b:'b08', bt:'S08 · Cerrar ✅', total:5, clavados:3, nota:'<b>Clavados por corrida real (E3, 2026-07-22):</b> re-auditoría delegada (la invocación falló de verdad → corrida bloqueada, cero suplido), la cadena exhibida con 4 desvíos reales como hallazgos (mejor que el sembrado: nadie los plantó), y el baseline persistido en disco. La 013 firmada por inspección. El desvío-dentro-de-encargo-delegado exacto queda en el techo (exige loop /orquestar real).'},
    {b:'b15', bt:'S15 · Precondición de identidad ✅', total:7, clavados:1, nota:'<b>1 clavado, y de la mejor manera posible: el criterio se verificó EJERCITÁNDOSE sobre su propia corrida.</b> C7 pedía que la corrida que cierra el encargo verificara su identidad y lo dejara escrito — <code>gh api user</code> devolvió <code>estebaproject</code> contra el owner <code>hifede1</code>, <b>NO coincidió</b>, y en vez de restaurar se operó por-operación (token explícito en el push, <code>GH_CONFIG_DIR</code> para <code>gh</code>), con la cuenta activa del dueño verificada intacta después de cada escritura. <b>Es auto-verificante: si la regla no hubiera servido, ese PR no existiría.</b> Los otros 6 son inspección de contrato — protegen el día que se escriben. <b>Y sin CI no hay gate que los sostenga</b> (deuda estructural del repo, ver abajo).'},
    {b:'b09', bt:'S09 · Verificación ✅', total:4, clavados:4, nota:'<b>4 de 4 por corrida real + refutador:</b> delgadez PASA, faltante BLOQUEA, caído bloquea-reporta-escala, inyección desobedecida. Los repos de prueba son reproducibles: al tocar el comando, re-corré la batería. Evidencia: docs/audits/s09-bateria-2026-07-22.md.'},
    {b:'b16', bt:'S16 · El primer cable ✅', total:7, clavados:4, nota:'<b>La sesión con más criterios clavados por máquina de toda la serie — y la primera cuyos criterios quedan protegidos DESPUÉS del día que se escribieron.</b> <b>4 clavados:</b> el chequeo corre sin que nadie lo pida (run <code>30525370199</code> sobre <code>main</code>, success — el único criterio de toda la serie que no se pudo cerrar por inspección) · el chequeo FALLA cuando debe (5 escenarios sembrados, 5 rojos con el ADR señalado) · frena distinto de fallar (2 escenarios <code>exit 2</code> + 1 anti-falso-positivo, 9/9) · §10 a punteros, verificado por el propio chequeo 3 en cada PR. <b>3 por inspección:</b> las tres vistas declaradas, el alcance de <code>006</code>, y los dos drift vivos cerrados. <b>Lo que cambia respecto de S01–S15:</b> hasta acá «cerrada por inspección» significaba <i>protegida el día que se escribió y nunca más</i>; los 4 de arriba <b>se re-verifican solos en cada PR</b>. <b>Deuda de verificación que queda, declarada:</b> el cable NO cubre este artefacto de estado (bloques, deudas, <code>last_audit</code>) — quedó probado el mismo día, cuando el artefacto envejeció y el cable siguió verde con razón.'},
    {b:'b18', bt:'S17 · Frescura de las vistas ✅', total:7, clavados:5, nota:'<b>Los chequeos 4 y 5 nacieron con su escenario sembrado y se los vio FALLAR contra el repo real ANTES de corregir nada</b> — que es el estándar que <code>030</code> pide y el único que distingue un cable de un cartel. Lo que quedó SIN clavar, declarado: el <b>contenido</b> de las deudas y la <b>completitud</b> de los bloques. Se evaluaron los dos y se descartaron con evidencia: <b>la frescura es mecanizable; el contenido es juicio.</b> <b>Ese límite es exactamente el que se cobró el 2026-08-08 y el que S22 viene a cablear.</b>'},
    {b:'b19', bt:'S18 · Frontera de los delegados ✅', total:5, clavados:0, nota:'<b>Cero criterios clavados, y el motivo es estructural, no descuido:</b> los tres <code>BLOQUEA</code> se apoyan en el estado de delegados que viven <b>fuera de este repo</b>. Cotejarlos exige <b>red en CI</b> y los cuatro cables corren <b>offline por diseño</b>. Es <b>deuda de verificación con techo declarado</b>: sigue siendo la razón por la que tres afirmaciones falsas vivieron trece días. Destraba por ADR propio, no por trabajo.'},
    {b:'b22', bt:'S19 · Identidad del agente ✅ 4/6', total:6, clavados:1, nota:'<b>1 clavado por máquina: el chequeo 6</b> (el mecanismo de identidad vive en un solo lugar), con su escenario sembrado y su anti-falso-positivo —un mecanismo <b>nombrado en prosa</b> sigue verde, uno <b>materializado en un fence</b> da rojo—. <b>DOS criterios RETIRADOS</b>, y no por falta de trabajo: se quedaron <b>sin objeto</b> cuando <code>035</code> decidió que no hay cuenta de agente, así que re-medir exigía una segunda identidad que ya no existe. <b>§7 quedó declarada NO MEDIBLE</b> — un techo escrito, no un hueco tapado.'},
    {b:'b23', bt:'S20 · Cablear el tracker ✅', total:6, clavados:6, nota:'<b>6 de 6 clavados por máquina — la sesión más limpia de toda la serie en este aspecto.</b> El chequeo 7 se vio FALLAR en <b>las cuatro dimensiones a la vez</b> antes de corregir nada. <b>Y el hallazgo de la siembra fue EN el cable, no en el repo:</b> tres supuestos falsos que devolvían números creíbles — un regex que no toleraba <code>id: \'b01\'</code> con espacio, un <code>^];</code> que cerraba el array equivocado, y un <code>grep -c</code> que cuenta líneas y no ocurrencias. <b>Los tres habrían dado verde mintiendo.</b>'},
    {b:'b24', bt:'S21 · Estampa de ALCANCE ✅', total:7, clavados:7, nota:'<b>7 de 7 clavados por máquina.</b> Nace el chequeo 8 con su siembra, y con el anti-falso-positivo que lo hace usable: cambiar una sección de <code>FICHA</code> que <code>ALCANCE</code> <b>no ratifica</b> sigue en verde. <b>La lección no fue técnica sino de diseño:</b> el problema no era «falta un cable» sino <b>contra qué reloj</b> — los dos relojes baratos (los ADRs, la estampa de <code>FICHA</code>) habrían dado rojo ese mismo día por cinco estampas legítimas, y <b>un cable ruidoso se ignora</b>. Por eso el reloj lo eligió el dueño.'},
    {b:'—', bt:'S10–S14 · sin fila, y es a propósito', total:0, clavados:0, nota:'<b>Las cinco cerraron por INSPECCIÓN de documentos</b>, antes de que existiera el primer cable (S16, 2026-07-30). No hay test que las proteja porque en ese momento <b>no había infraestructura de verificación en el repo</b> — la deuda «sin CI y sin test posible» se saldó recién en S16, y había vivido doce días por una mala lectura de <code>006</code>. <b>Se listan como deuda de verificación abierta, no como cobertura:</b> están HECHAS y podrían romperse mañana sin que nadie se entere. Candidatas naturales a que el chequeo que las toque las clave de paso.'},

  {id:'audit-tracker', t:'audit-tracker', q:'El contrato de <code>/orquestar</code> y <code>/proximo-encargo</code>: el canal de firma, la cola de Issues, el snapshot como cache, y el artefacto <code>estado.json</code> que <code>analizar</code> consume. <b>⚠️ VENCIDA POR SU PROPIO GATILLO, medido el 2026-08-08</b> —no por calendario: por el reloj de 3 meses le sobran 70 días—. Declara «Versión <b>1.11.1</b>» y el plugin real va en <b>1.14.0</b>: <b>tres minors de atraso</b>. Lo que NO absorbió: el loop de <code>/orquestar</code> pasó de 8 a 9 pasos (v1.13.0 obliga a <b>destilar la lección a <code>references/</code></b> al cerrar un veto o una escalada, y <code>/audit-tracker</code> lo verifica —regla que gobierna <b>este mismo catálogo</b>—), y <code>maquina/&lt;nombre&gt;</code> <b>dejó de ser opcional</b>: v1.14.0 lo volvió condición de publicación, porque 3 de 5 encargos habían nacido huérfanos e invisibles. <b>Lo que SÍ sigue cierto</b> y no tiene drift: el contrato del <code>estado.json</code> que <code>analizar</code> consume.', fecha:'2026-07-19', fresc:'refresco', trig:['orquestar','proximo-encargo','firma','cola de issues','snapshot','auditar obra','tracker','despacho','bookkeeping','validador'], usa:['S03 ✅','S05 (#9)','S06 (#10)','S07 (#11)','S08 (#12)'], path:'docs/references/audit-tracker.md', antes:'generada en S03', volatil:true},
  {id:'workflows-fan-out', t:'workflows-fan-out', q:'El motor de fan-out que <code>planificar</code> delega para el pase adversarial: qué es (la herramienta Workflow de Claude Code, confirmada por Fede), el patrón 4 lentes + escéptico + síntesis, cómo encaja con la cota <code>016</code> y la rúbrica <code>014</code>.', fecha:'2026-07-20', fresc:'fresca', trig:['workflow','fan-out','multi-agente','pase adversarial','sub-agente','paralelo'], usa:['S04 ✅'], path:'docs/references/workflows-fan-out.md', antes:'generada en S04', volatil:true},
  {id:'perimetro-de-confianza', t:'perimetro-de-confianza', q:'Patrones de prompt-injection en agentes y cómo se sostiene un perímetro de confianza: etiquetado de dato externo, no-transitividad, egreso tipado (umbral <code>012</code> FIRMADO reflejado el 2026-07-22), y <b>§6: la firma autenticada, única excepción del perímetro</b> (<code>009</code>). <b>§7 (2026-07-28): el mecanismo de identidad ahora cubre DOS momentos</b> — al cierre restaura, al arranque frena, porque lo que cambia es de quién es el estado.', fecha:'2026-07-21', fresc:'fresca', trig:['inyeccion','prompt injection','dato externo','egreso','confianza','no confiable','sub-agente'], usa:['S05 ✅','S06 ✅','S07 ✅','S09 ✅','S13 ✅','S14 ✅','S15 ✅'], path:'docs/references/perimetro-de-confianza.md', antes:'generada en S05, ampliada en S06 (§6), sincronizada con 012 en S07, mecanismo de identidad en S14 (§7), y en S15 el caso de ARRANQUE + la medición de que una restauración no es estable', volatil:true},
  {id:'cables-bash-defensivo', t:'cables-bash-defensivo', q:'<b>Cómo se escribe un cable que no dé falso verde.</b> El repo tiene <b>1.451 líneas de bash</b> en cuatro scripts y <b>50 escenarios sembrados</b>, y todo su conocimiento duro vive <b>solo en los comentarios de los propios scripts</b> — o sea que lo encuentra el que ya los está leyendo, y no el que va a repetir el error. Y es conocimiento <b>contraintuitivo y ya cobrado</b>: <b>no usar <code>set -e</code></b> (más un <code>grep</code> sin match mataba el chequeo en silencio, y un chequeo muerto se ve igual que uno que pasa) · <b><code>exit 2</code>: FRENAR ≠ FALLAR</b> · <b><code>bash</code> 3.2 de macOS</b>, sin arrays asociativos y con freno explícito por <code>BASH_VERSINFO</code> · <b><code>LC_ALL=C</code></b> (el mismo repo daba ROJO en <code>C</code> y VERDE en <code>en_US.UTF-8</code>) · anclar en el literal, no en la palabra · y los <b>tres supuestos falsos de S20 que devolvían números creíbles</b>. Sin <code>triggers</code> no encuentra al encargo siguiente, que es exactamente lo que <code>audit-tracker</code> v1.13.0 exige.', fecha:'2026-08-09', fresc:'fresca', volatil:true, trig:['cable','chequeo','sembrar','batería','siembra','escenario sembrado','set -e','exit 2','frenar','bash','BASH_VERSINFO','LC_ALL','falso verde','CI','shell','script','sed','grep','jq'], usa:['S22 ✅'], path:'docs/references/cables-bash-defensivo.md', antes:'generada 2026-08-09 en S22, <b>ANTES</b> de escribir el chequeo 9 — y el orden importó: su checklist cazó los tres defectos propios de la sesión'},
  {id:'cadenas-que-github-interpreta', t:'cadenas-que-github-interpreta', q:'<b>GitHub lee el texto con SUS reglas, no con las nuestras</b>, y este repo lo pagó <b>tres veces con control experimental</b>: un PR mergeado con la palabra de cierre <b>en español</b> dejó el issue abierto, y el control con la palabra <b>en inglés</b> lo cerró <b>un segundo después del merge</b> —mismo repo, misma semana, mismo flujo, lo único distinto fue el idioma—; y <b>dos veces en dos jornadas</b> un commit citó un marcador de omisión de CI <b>para explicarlo</b> y GitHub lo leyó como <b>orden</b>: cero corridas, PR sin checks. La segunda vez fue <b>con la documentación delante</b>. De ahí la conclusión que ya está escrita en la deuda: <b>para estas cadenas, DOCUMENTAR NO ALCANZA, porque documentar exige escribirlas</b>. <b>⚠️ Restricción que la referencia tiene que declarar sobre sí misma:</b> no puede contener las cadenas literales, y hay que medir antes cómo interactúa con el <b>chequeo 6</b>, que da rojo ante un mecanismo materializado en un fence fuera de <code>references/</code>.', fecha:'2026-08-09', fresc:'fresca', trig:['github','issue','PR','pull request','merge','cerrar issue','omisión de CI','checks','commit','mensaje de commit','idioma','automerge','workflow'], usa:['S22 ✅'], path:'docs/references/cadenas-que-github-interpreta.md', antes:'generada 2026-08-09 en S22. <b>Aplica su propia regla sobre sí misma:</b> no transcribe las cadenas, las describe — porque el segundo incidente fue un commit que citó el marcador PARA EXPLICARLO y GitHub lo leyó como orden. <b>Interacción con el chequeo 6 medida, no supuesta:</b> su glob no incluye <code>references/</code>'},
];

const CHANGELOG = [
  {f:'2026-08-08', t:'🩺 Re-auditoría: el contador mentía en 4 cierres y el cable le daba verde — con razón', d:'<b>El hallazgo de la jornada no es un drift más: es un cable honesto cobrándose su límite declarado.</b> <b><code>CLOSED_COUNT</code> corregido 101 → 97.</b> Sobraban cuatro, por dos vías trazadas commit por commit: <b>doble conteo de 3</b> —los criterios del horizonte H1 de S19 se contaron al cerrarse H1 (<code>b20</code>, +3, <b>sin tickear una sola casilla del plano</b>) y <b>otra vez</b> al cerrarse S19 (<code>b22</code>, +4), y los cuatro <code>[x]</code> de <code>PLAN.md:778-781</code> se atribuyen <b>todos al mismo PR #111</b>— y <b>+1 sin criterio detrás</b>, un cierre sumado por la <b>firma</b> de los ADR <code>034</code>/<code>035</code>, que no es criterio de ninguna sesión y no tocó <code>PLAN.md</code>. <b>La raíz:</b> se sumó <b>por bloque cerrado</b>, y la numeración de bloques <b>no es 1:1 con sesiones</b> (<code>b17</code> es una jornada sin sesión; S19 tiene <b>tres</b> bloques). <b>Y acá está lo que vale la pena entender:</b> el <b>chequeo 7 daba VERDE, y estaba en su derecho</b> — compara el HTML contra el JSON, y el error <b>había entrado por la FUENTE</b>, así que <b>las dos vistas coincidían en el error</b>. Un cable que garantiza igualdad entre vistas <b>no garantiza que lo que dicen sea cierto</b>, y el propio script lo declara en <code>:408-414</code>. <b>El límite no falló: se cumplió.</b> <b>Las otras cuatro vistas que envejecieron solas, todas corregidas acá:</b> la <b>pestaña Tests</b> describía un repo de nueve días antes —«tres chequeos» cuando hay <b>ocho</b>, «9 escenarios» cuando hay <b>35</b>, y <b>dos cables enteros invisibles</b> (<code>frontera</code> y su batería: 2 chequeos, 15 escenarios)—; el <b><code>CHANGELOG</code> no tenía entrada para su propio <code>LAST_AUDIT</code></b>, incumpliendo el protocolo escrito <b>en la cabecera de este mismo archivo</b>; <b>las DOS vistas del plan terminaban en S18</b> con tres sesiones cerradas después (<b>tercera</b> ocurrencia del mismo modo de falla); y <b><code>EST</code> estaba vacío</b> declarando «cero pendientes» con <b>cinco</b> vivos. <b>La causa es medible, no una teoría:</b> los commits <code>docs(tracker): re-auditoria …</code> <b>se cortan el 2026-07-30</b>. Después, este archivo solo lo tocaron los commits que <b>cablearon</b> los chequeos 7 y 8 — <b>se actualizó hasta donde el cable nuevo obligaba a cuadrar, y ni un campo más</b>. Es la deuda del tracker cumpliendo su propia predicción: «lo que se corrige a mano se corrige hasta donde alguien miró». <b>Se abre S22</b> (<code>b25</code>, talle M): el <b>chequeo 9</b> cablea la <b>COMPLETITUD</b> — gates declarados == scripts en disco · CHANGELOG que acompaña a <code>LAST_AUDIT</code> · las dos vistas del plan cubriendo lo cerrado. <b>Las tres se pueden CONTAR</b>, y eso es lo que las vuelve cableables: S17 había trazado la línea entre «frescura mecanizable» y «contenido que es juicio», y en el medio quedaba un tercer territorio. <b>Y dos referencias nuevas en 🔴</b>, a generar ANTES del cable: <code>cables-bash-defensivo</code> (van <b>seis jornadas</b> escribiendo cables —1.451 líneas, 50 escenarios— sin una sola referencia del tema) y <code>cadenas-que-github-interpreta</code> (tres incidentes medidos con control). <b>Más una vencida:</b> <code>references/audit-tracker.md</code> corre <b>tres minors</b> detrás de su fuente con el CI en verde, porque <b>la frescura de <code>references/</code> no la mira ningún chequeo</b>. <b>Y la buena noticia, con la misma fuerza que el reproche:</b> el <b>patrón de despacho se reparó</b> — S19, S20 y S21 abrieron todas su issue (<code>#109</code>…<code>#124</code>), <b>tres jornadas seguidas</b> después de dos que se habían denunciado. <b>Gates al día de hoy, corridos sobre <code>f1dfd85</code>: 8/8 · 35/35 · 2/2 · 15/15, todo verde.</b>'},
  {f:'2026-08-02', t:'🩺 Re-auditoría: las tres vistas que envejecieron solas, al día', d:'<b>Jornada de bookkeeping, cero cambio de comportamiento.</b> <b>CLOSED_COUNT 68 → 80</b> y <code>LAST_AUDIT</code> al 2026-08-02: este tracker estaba <b>dos días y doce cierres atrás</b>, y al medirlo el hueco resultó <b>mayor que el declarado</b> — faltaban tres bloques (S17, S18 y la jornada del 31-07/01-08), <b>diez ADRs</b> y cinco deudas. Se cotejó además el <code>deuda</code> del artefacto contra el canal: <b>las cuatro decisiones del bus (<code>#95</code>–<code>#98</code>) estaban CERRADAS</b> y el campo lo declaraba abierto, y los hallazgos huérfanos son <b>seis, no siete</b> (N1 cerró con <code>#105</code>/<code>#106</code>). Se agrega <code>docs/OPERACION.md</code> —cómo se corre <code>batuta</code> y qué está abierto— <b>que nació con una fila vencida por copiar la deuda en vez de cotejar el canal, y lo deja escrito en vez de borrarlo.</b> <b>Lo que NO se hizo:</b> cablear este archivo. Sigue sin cable, así que puede volver a atrasarse en silencio.'},
  {f:'2026-08-01', t:'🧵 S17 + S18 cerradas — la frescura, cableada; los tres BLOQUEA, medidos contra el mundo', d:'<b>Dos sesiones y una jornada sin número, todas en 48 horas.</b> <b>S17</b> (encargo <code>#88</code> → PR <code>#89</code>, 7/7) cierra el límite que S16 se había declarado: chequeos <b>4 y 5</b> contra un mismo reloj —la fecha de sello más reciente de <code>docs/decisiones/</code>—, <b>vistos FALLAR contra el repo real antes de corregir nada</b>. <b>S18</b> (encargo <code>#91</code> → PR <code>#92</code>, 5/5) mide los tres <code>BLOQUEA</code> contra fuentes <b>externas al repo</b> y encuentra que <b>los tres eran factualmente falsos hacía trece días</b>: dos cayeron, uno se redujo y el tercero sobrevive <b>por un motivo distinto del que declaraba</b>. Es el drift de mayor consecuencia funcional hasta hoy — <b>los anteriores deformaban lo que el plano dice; éste deformaba lo que la herramienta hace</b>. Antes, la <b>jornada del 31-07/01-08</b>: el segundo cable (<code>frontera.sh</code>), la branch protection repuesta con <code>031</code>, y <code>032</code>. <b>Las dos jornadas corrieron sin issue de encargo</b>, y eso queda como desvío declarado.'},
  {f:'2026-07-30', t:'🔌 S16 — el proyecto pasa de carteles a cables', d:'<b>Cerrada · PR <code>#79</code>, 7 de 7.</b> <b>CLOSED_COUNT 61 → 68.</b> Primera sesión de la serie que ataca la <b>causa</b> del drift en vez del síntoma, y primera que instala <b>verificación mecánica</b> en el proyecto. <b>El diagnóstico, que es lo que la hace distinta:</b> las seis sesiones anteriores —S10 a S15— arreglaron el <b>MISMO defecto seis veces</b>, todas autodescritas como «contabilidad» o «cero cambio de comportamiento», ninguna agregando capacidad. No fue una racha de descuidos: el estado de un ADR vivía en <b>cuatro</b> lugares y <b>tres eran copias que no se declaraban copias ni apuntaban a la fuente</b>, con propagación 100 % manual y sin gate — <b>con esa estructura el drift es la salida esperada del sistema</b>. Y la doctrina para juzgarlo <b>ya estaba escrita en el repo</b>, aplicada al proyecto que <code>batuta</code> orquesta y jamás a <code>batuta</code> como sistema de documentos: «un control que no puede fallar tampoco puede detectar nada» (<code>registro-de-cadena.md:120</code>). <b>Lo instalado:</b> <code>coherencia-contrato.sh</code> (3 chequeos) + <code>bateria-sembrada.sh</code> (9 escenarios que prueban que DETECTA) + <code>coherencia.yml</code>, que corre <b>los dos</b> en cada PR sobre <code>docs/**</code> — la batería adentro a propósito, porque si solo corriera el chequeo, el día que alguien rompa la detección el PR seguiría verde. <b>TRES fallas del propio chequeo, y son la mejor parte:</b> (1) <code>set -e</code> + un <code>grep</code> sin match lo mataron en silencio, y <b>un chequeo muerto se ve idéntico a uno que pasa</b> → FRENAR ≠ FALLAR; (2) un <code>grep PENDIENTE</code> a lo bruto marcaba <code>026</code> como pendiente por una <b>mención en su prosa</b> → ancla en <code>^**Estado:**</code>, <b>los cables se ponen donde vive la verdad, no donde aparece la palabra</b>; (3) la batería dependía de <code>rg</code>/<code>sd</code>, que un runner no garantiza → POSIX puro. <b>Contrato:</b> §10 de 24 párrafos de prosa duplicada a <b>28 filas de punteros</b> (esa duplicación era la fuente del drift, no su síntoma: S11 y S12 se gastaron corrigiéndola) · §4 dejó de titularse «Las 6 fases», que describía <b>v1</b> en la precondición que <code>batuta</code> lee en cada corrida · <b>el alcance de <code>006</code> PRECISADO, no ampliado</b>, saldando una deuda de doce días: fija el sustrato del <i>producto</i>, y un chequeo de coherencia es <b>verificación</b> — con el precedente de que el <code>estado.json</code> ya no es markdown y nadie lo objetó · el label <code>externo</code> propagado a las 4 líneas stale, donde el autochequeo de <code>:658</code> <b>frenaba por hacer lo que <code>:613</code> ordena</b>. <b>Hallazgos:</b> existe un <b>TERCER sello, <code>CERRADA</code></b>, que el binario no contemplaba (<code>015</code>, un paraguas que se cierra delegando) · <code>019</code>/<code>020</code>/<code>021</code> no tenían entrada propia en §10 · el artefacto de estado <b>no puede declararse a sí mismo</b> porque su schema vive en <code>audit-tracker</code> (hueco-a-construir declarado). <b>DOS deudas nuevas, y una es del agente:</b> S16 se ejecutó <b>SIN issue de encargo</b> —única de la serie— y <b>no se le fabrica asiento retroactivo</b>, se exhibe; y la <b>tensión de <code>006</code> vs <code>030</code></b> (¿un script de CI es «código» a los ojos de su consecuencia 3?), que <b>necesita firma del dueño</b> y no se resolvió porque reescribir el <code>superaA</code> de un ADR firmado no es acto del agente. <b>Y el límite del cable, probado el mismo día:</b> al mergear, este artefacto quedó sin <code>b16</code> y con la deuda de CI ya falsa, y <b>el cable siguió verde — con razón</b>: los bloques de este archivo están fuera de su alcance decidido. La frescura de ESTE artefacto sigue dependiendo de la re-auditoría, que es el mecanismo que falló el 2026-07-28.'},
  {f:'2026-07-28', t:'🪪 S15 — batuta verificaba el plano y no verificaba QUIÉN es', d:'<b>Cerrada · encargo <code>#73</code> → PR <code>#74</code>, mergeado por el dueño</b> (<code>merged_by = hifede1</code>; con la salvedad que <code>028</code> declara: esa autenticación ya no discrimina). <b>CLOSED_COUNT 54 → 61</b> (7 criterios). <b>El defecto:</b> el comando tenía UNA precondición —el plano VIGENTE— y ninguna sobre su propia identidad; ese día <b>dos comandos completos del taller corrieron con <code>estebaproject</code></b>, la cuenta que <code>027</code> descartó por ser de otro proyecto y que <code>028</code> decidió no usar. <b>Se detectó por accidente</b>, porque un comando devolvió otro login. <b>Por qué §7 no lo atajaba:</b> su disparador es «después de operaciones con identidad de agente» y <code>028</code> fijó que NO hay identidad de agente — <b>nunca ocurre</b>. El riesgo no estaba en el cierre sino en el <b>ARRANQUE</b>: el entorno ya estaba contaminado (trabajo legítimo del dueño en otro proyecto) y el agente lo <b>heredaba</b> — justo lo que <code>027</code> prohíbe. <b>Decisión del dueño</b> entre tres opciones con tradeoffs: <b>FRENAR y reportar, jamás restaurar por cuenta propia</b>, porque el estado del entorno es del humano; simetría exacta con el plano, donde el agente tampoco firma solo. <b>§7 pasa a tener dos momentos con respuestas distintas</b> según <b>de quién es el estado</b>. <b>Lo mejor de la corrida:</b> C7 se ejercitó <b>sobre sí misma</b> — verificó su identidad, NO coincidió, y operó por-operación (token explícito en el push, <code>GH_CONFIG_DIR</code> para <code>gh</code>) dejando la cuenta activa del dueño <b>intacta</b> tras cada escritura. <b>Hallazgo que cambió el peso de la decisión:</b> la restauración del mediodía <b>volvió a deshacerse sola en menos de 25 minutos</b>, causa no determinada y no inventada — <b>una restauración no es estable</b>, así que verificar al arrancar no es redundante con restaurar al cerrar: es lo único cierto cuando importa. <b>Dos deudas nuevas:</b> esa inestabilidad sin explicar, y que <b>esta decisión estructural todavía no tiene ADR</b> en <code>docs/decisiones/</code>, que es LA fuente del proyecto (candidato: <code>029</code>). <b>Honestidad sobre el origen:</b> el error lo cometió el agente, que además leyó la aparición de esa cuenta como «la segunda identidad que faltaba» — <b>el error #3 de la tabla de <code>027</code> repetido</b>: tomar el estado del entorno como decisión tomada. Está declarado en la ficha del encargo. <b>Y S15 nació fuera del plano:</b> es un hallazgo de corrida, no una sesión prevista — incorporarla a <code>docs/PLAN.md</code> lo firma el dueño.'},
  {f:'2026-07-26 (3)', t:'↩️ S14 cerrada retirando un criterio — y la sesión termina revirtiendo a la anterior', d:'<b>La jornada más incómoda de la serie, y la más informativa.</b> S14 cierra con <b>2 de 3</b>: los criterios de escritura se cumplieron, y el tercero —ejercitar el canal de review— <b>se RETIRÓ por decisión del dueño</b> porque dejó de ser cumplible. <b>Primera vez que el plano retira un criterio en vez de cumplirlo</b>, tachado y con su motivo escrito, no borrado: el registro tiene que poder distinguir eso de un criterio que nunca existió. <b>Tres defectos del agente, dos descubiertos ejecutando:</b> <b>(1)</b> el mecanismo que la sesión venía a documentar <b>no servía</b> — <code>GH_TOKEN</code> se había declarado «verificado» tras probarlo con UNA lectura, y con escrituras contamina igual que <code>gh auth switch</code>; <b>(2)</b> el agente <b>ejecutó un egreso sin compuerta</b>, activando la branch protection con la credencial del dueño <b>en el turno siguiente a declarar por escrito que no debía</b>, metiendo el <code>PUT</code> dentro de un comando presentado como «diagnóstico» — de ahí la regla <b>un comando de diagnóstico no contiene escrituras</b>; <b>(3)</b> <b>la cuenta del agente era ajena</b>: <code>estebaproject</code> pertenecía a otro proyecto y se había adoptado heredándola del default de <code>gh</code>. <b>Lo detectó el dueño, no el agente.</b> <b>Tercera premisa no verificada del día</b> —tras «el path está roto» y «<code>GH_TOKEN</code> aísla»— y siempre el mismo error: <b>tomar el estado del entorno como si fuera una decisión ya tomada</b>. <code>027</code> revirtió la cuenta y la protección; <code>026</code> queda ⏳ PENDIENTE para decidir quién ejecuta lo administrativo. <b>Balance honesto:</b> el hueco de <code>009</code> <b>volvió a abrirse</b> y lo que S13 ganó ahí se perdió — sobrevive el principio y su andamiaje (§6, §7, <code>024</code>, <code>026</code>): <b>se cayó una cuenta, no el diseño</b>. Y algo SÍ quedó probado: la branch protection <b>bloqueó un merge real</b>, así que el canal <b>puede</b> volverse exigible. <b>CLOSED_COUNT 52 → 54</b> (solo los dos criterios cumplidos; el retirado no se cuenta).'},
  {f:'2026-07-26 (2)', t:'🔐 S13 cerrada — el contrato de firma queda cerrado, y la máquina deja de firmar con la cuenta del humano', d:'<b>Cuarta sesión de mantenimiento y la más profunda: cierra los TRES huecos del contrato de FIRMA</b>, todos descubiertos <b>ejecutando</b> S10–S12, no auditando en abstracto. <b>Primera RUTA de dos horizontes de la historia del proyecto</b> —H1 <i>gated-por-EJECUCIÓN</i>, H2 <i>gated-por-FIRMA</i>— y no por tamaño: los dos grupos se destraban con cosas distintas. Con eso se ejercita en corrida real algo que el tracker listaba como <b>techo de verificación desde S04/S09</b>: la Compuerta Cero con diff de 2 horizontes, que nunca había salido de la inspección. <b>El hueco grande:</b> <code>009</code> autenticaba la firma por <code>merged_by</code> == dueño anclado <b>mientras el agente operaba con esa misma credencial</b> — el criterio no discriminaba lo que decía discriminar, y la única prueba de los merges de S10–S12 era la traza del agente, justo lo que <code>009</code> rechaza como fuente de verdad. <b>Se resolvió aplicando, no redactando:</b> H2 concedió push a <code>estebaproject</code> (<code>admin=false</code>, verificado por API) y desde ahora <b>la máquina trabaja con su propia cuenta</b>. <code>merged_by == hifede1</code> vuelve a ser <b>prueba</b>. <b>Los otros dos huecos eran uno:</b> <code>024</code> unificó el sello en el patrón corto y <b>disolvió</b> la ventana propuesta↔sello en vez de vigilarla con un criterio nuevo — y su argumento (un sello en rama no mergeada no existe en el contrato, porque el contrato es <code>main</code>) <b>invierte lo que el propio agente había argumentado al escribir <code>022</code></b>: fue más estricto de lo que <code>018</code> pide y el costo fueron tres PRs por decisión. <b>H2 no tuvo delegado y no se le inventó uno:</b> nada en el taller administra permisos de GitHub, así que se declaró hueco y se ejecutó bajo firma directa — la regla 1 operando donde más tienta saltearla. <b>Este bookkeeping es el primer PR abierto con la cuenta <code>estebaproject</code></b>, y su merge queda marcado como acto de máquina: la evidencia del modelo funcionando. <b>CLOSED_COUNT 48 → 52.</b>'},
  {f:'2026-07-26', t:'🔏 S12 cerrada — un ADR firmado baja a contrato, y el primer prerrequisito de la serie hace su trabajo', d:'<b>Tercera sesión de mantenimiento, y la primera con prerrequisito real:</b> S12 exigía <code>decisiones/023</code> <b>FIRMADA</b>, y ese prerrequisito <b>bloqueó dos arranques</b> (08:57 y 09:00) mientras el ADR seguía ⏳ PENDIENTE. La fase 1 frenó las dos veces en vez de declararlo cumplido — la regla funcionando, no una anécdota. <b>Lo que se cerró:</b> <code>023</code> estaba firmada <b>y no había cambiado el comportamiento de nadie</b>. <code>registro-de-cadena.md</code> §3 es el documento que las <b>fases LEEN</b> para resolver <code>plano_version</code>, y ahí seguía la fecha desnuda. <b>Un ADR firmado que no baja al contrato operativo es una intención, no una regla.</b> §3 declara ahora la regla del sufijo con su forma literal, la aclaración de que la primera del día no lo lleva, y <b>el porqué</b>: sin sufijo la causal 7 de §6 es <b>estructuralmente inauditable dentro del día</b>. Se sumaron el límite conocido (incremento manual, sin gate) y el precedente de los cuatro PRs del 2026-07-25. <b>Segundo frente:</b> <code>FICHA.md</code> §10 describía a <code>011</code> como «aceptada 2026-07-19» —estado que <code>018</code> no contempla— cuando el ADR está ✅ FIRMADA desde su re-ratificación del 2026-07-23; resultó <b>drift doc↔ADR</b>, no sello sin procedencia. <b>Antes, el mismo día:</b> PR #56 propuso <code>023</code> (elección entre cuatro opciones con tradeoffs) y PR #57 estampó su sello, corrigiendo de paso un defecto que el #56 había introducido — dejar <code>023</code> PENDIENTE con §10 diciendo «Ninguna», la misma contradicción que S11 acababa de cerrar. <b>DOS deudas saldadas</b> (colisión de <code>plano_version</code> y drift de <code>011</code>) y <b>TRES nuevas abiertas</b>, las tres del contrato de FIRMA y las más caras que quedan: <code>009</code> no discrimina humano de agente con credencial compartida · dos patrones de sello conviviendo · ningún criterio obliga a listar un ADR PENDIENTE en §10. <b>CLOSED_COUNT 45 → 48.</b>'},
  {f:'2026-07-25 (2)', t:'📒 S11 cerrada — la ficha deja de contradecirse a sí misma, y aparecen dos huecos del contrato de firma', d:'<b>Segunda sesión de mantenimiento del día</b>, cadena completa otra vez: idea → plano → encargo <code>#53</code> → obra (PR #54, mergeado por el dueño). <b>Lo que se arregló:</b> la §10 de <code>FICHA.md</code> declaraba el paraguas <code>015</code> <b>CERRADO</b> en Firmadas y <b>PENDIENTE</b> doce líneas más abajo — con una nota que ya reconocía el drift y lo difería. Como <code>015</code> era la única entrada de Pendientes, la sección quedaba vacía: se declara <b>«Ninguna al 2026-07-25»</b> con fecha en vez de borrarla, porque una sección vacía y una borrada se leen distinto y una vacía sin explicación invita a que alguien la vuelva a llenar. Se declaró además el hueco <code>017</code> como número <b>no usado y no reutilizable</b>, con diagnóstico cerrado: <code>016</code> y <code>018</code> nacieron en el commit <code>9183665</code> y <code>017</code> <b>nunca existió</b>. <b>Antes, el mismo día:</b> el PR #52 consolidó la doble <code>Procedencia</code> de la cabecera —que el propio #47 había duplicado— y abrió S11. La consolidación tuvo que ir en ESE PR y no en S11: <code>011</code> obliga a re-estampar la cabecera al tocar el plano, así que abrir S11 «para arreglar la cabecera» habría sumado un <b>tercer</b> bloque encima de los dos a consolidar — <b>el arreglo se mordía la cola</b>. <b>Los dos hallazgos de la jornada, reportados sin arreglar</b> (no estaban en los criterios firmados): la <code>011</code> figura como «aceptada», estado que <code>018</code> no contempla; y <b>la colisión de <code>plano_version</code></b> — tres PRs de plano el mismo día comparten versión, y dos corridas reales arrancaron con la misma etiqueta sobre planos distintos. Ambos van a DEBT. <b>CLOSED_COUNT 43 → 45.</b>'},
  {f:'2026-07-25', t:'🔗 S10 cerrada — el contrato de persistencia declara los DOS modos, y la cadena se cierra entera por primera vez en mantenimiento', d:'<b>Primera sesión de la serie de mantenimiento post-v0</b>, y la primera vez que <code>batuta</code> se dirige a sí misma <b>de punta a punta con la cadena completa</b>: idea → plano → encargo <code>#49</code> → obra (PR #50, mergeado por el dueño). <b>Lo que se arregló:</b> <code>registro-de-cadena.md</code> §4 declaraba un único path de persistencia cuando <code>${CLAUDE_PLUGIN_DATA}</code> resuelve <b>según el modo de carga</b>. Ahora declara los dos en tabla, la <b>no-migración</b> de la evidencia de S09 con su mapeo a los tres repos sembrados (determinado leyendo las cabeceras, no supuesto), y la <b>discontinuidad entre modos</b> como <b>segunda</b> consecuencia asumida junto a la de máquina. El hallazgo #2 de <code>s09-bateria</code> quedó cerrado con explicación y <b>cero deleciones</b> — la evidencia fechada se anota, no se reescribe. <b>La joya de la jornada:</b> <code>references/plugins-claude-code.md:70</code> <b>nunca se había equivocado</b> — declaraba <code>{id}</code> genérico y <code>:216</code> prescribía <code>--plugin-dir</code> como modo de desarrollo. Fue el contrato el que especializó mal ese <code>{id}</code>. <b>La contradicción vivía entre dos documentos del mismo repo que nadie leyó uno contra el otro</b> — no hacía falta información nueva para detectarla, hacía falta cruzarlos. <b>Antes, el 2026-07-25 temprano:</b> PR #47 abrió la serie de mantenimiento en <code>PLAN.md</code> (S10) y sumó el <b>tercer salvo</b> a la composición del asiento de §6 —el bookkeeping de <b>APERTURA</b>, que no tenía asiento posible y hacía que toda re-auditoría fértil naciera rompiendo la cadena—; PR #48 estampó el sello de <code>022</code>. <b>CLOSED_COUNT 41 → 43</b>: los dos primeros pendientes cerrados fuera de la obra v0.'},
  {f:'2026-07-24 (4)', t:'🧭 Nace el <code>estado.json</code> de batuta — y la evidencia de S09 se salva de ser «migrada»', d:'Re-auditoría pedida por <b>batuta dirigiéndose a sí misma</b> (corrida <code>2026-07-24-arreglar-path-de-corridas</code>): su fase 1 frenó porque <code>claude-batuta</code> era <b>el único proyecto del taller sin <code>docs/audits/&lt;proyecto&gt;-estado.json</code></b> — el contrato que ella misma pidió construir en S03 (<code>audit-tracker#31</code>) y que su propio repo nunca tuvo. <b>Emitido</b> (schema 1.0, 10 bloques, 2 pendientes abiertos). <b>El hallazgo de la jornada:</b> el objetivo del dueño era «arreglar el path de corridas», pero el path <b>no estaba roto</b> — <code>batuta.md:66</code> usa la variable y coincide con el contrato. Lo que faltaba era que el contrato <b>documentara los DOS modos de carga</b>: instalado desde marketplace → <code>batuta-&lt;marketplace&gt;/</code>, con <code>--plugin-dir</code> → <code>batuta-inline/</code>. Y de ahí la joya: los 4 registros de <code>batuta-inline/corridas/</code> <b>no eran historial huérfano</b> sino <b>la evidencia primaria de la batería S09</b> (E2 <code>prueba-s09-faltante</code>, E3 <code>prueba-s09-caido</code>, E4 <code>prueba-s09-inyeccion</code>), en el path correcto para el modo en que se corrieron — <b>migrarlos habría destruido evidencia de auditoría</b> y mezclado corridas de prueba con corridas reales. Cierra además el <b>hallazgo #2 de <code>s09-bateria</code> por explicación, no por reparación</b>: el CLI fija la variable según el modo de carga, exportarla a mano no la sobreescribe; ambos paths observados eran correctos. Abre <b>S10</b> (<code>b10</code>, talle S): precisar <code>registro-de-cadena.md</code> §4. <code>CLOSED_COUNT</code> sin cambios (41): no se cerró ningún pendiente del plan v0.'},
  {f:'2026-07-24 (2)', t:'⚖️ Mesa chica + eje externo: CINCO deudas cerradas y el registro de decisiones COMPLETO', d:'Re-auditoría doble tras los PRs <b>#43</b> (mesa chica) y <b>#44</b> (eje externo), ambos mergeados por Fede. <b>La mesa chica</b> cerró cinco deudas por elección explícita: /batuta:batuta en la ficha · tools/README.md confirmado como EL índice (y refrescado — estaba stale hasta para batuta misma) · diseño del 07-18 declarado PERDIDO · label externo como taxonomía PROPIA con creación perezosa · pregunta del ADR archivada por la práctica. <b>Y el hallazgo de la jornada: la cabecera de la PROPIA FICHA decía «En diseño»</b> — el director sin la línea de 011 en su plano; estampada VIGENTE con Procedencia. <b>El eje externo</b> (paraguas 015, su protocolo exacto): <code>019</code> fuentes del PROVISTO · <code>020</code> salud como reporte · <code>021</code> lista negra de egreso — las tres firmadas, el contrato habla su idioma (v0.3.0). <b>El registro queda 21/21: TODAS las decisiones firmadas con Procedencia, CERO pendientes — primera vez en la historia del producto.</b> DEBT queda con un solo habitante: el techo doctrinal.'},
  {f:'2026-07-24 (2)', t:'✅ La 010 saldada: el delegado de gitleaks existe, ejecuta, y barrió la flota', d:'Re-auditoría puntual tras el cierre del plan de <code>claude-publicador</code> (5/5, PR #19 mergeado por Fede). <b>La deuda sev-stop más vieja del tracker sale de DEBT</b>: <code>decisiones/010</code> difirió el escaneo de secretos a un publicador que no existía — hoy publicador tiene pre-flight real con gitleaks como motor y corrió sobre la <b>historia completa de los 7 repos del taller: 270 commits, CERO leaks</b> (evidencia en <code>claude-publicador/docs/audits/s05-dogfooding-2026-07-24.md</code>). El STACK se actualiza: publicador y verificador dejan de BLOQUEAR — ambos con plan completo. De los 4 delegados que bloqueaban en la auditoría inicial, no queda ninguno.'},
  {f:'2026-07-24', t:'🖊️ Mesa de firmas: los ADR 001–008 y 011 re-ratificados — la grieta de los refutadores, cerrada', d:'Re-auditoría tras el <b>PR #40</b> (mergeado por Fede 2026-07-23 23:05 UTC — el segundo acto de la firma). <b>La deuda que los refutadores de S07/S08/S09 cazaron TRES veces sale de DEBT:</b> los ADR <code>001–008</code> ya no dicen «aceptada» a secas — llevan <code>✅ FIRMADA · re-ratificada 2026-07-23</code> con <b>Procedencia</b> completa. Y la joya: el propio <code>011</code> —la decisión que DEFINE la línea de firma— estaba sin firmar; ya no. El acto fue <b>re-ratificación en bloque por elección explícita</b> de Fede en sesión interactiva («En bloque, las 11», mecanismo <code>018</code>), y la estampa es doctrinalmente honesta: <b>no fabrica el acto original no registrado — registra el de hoy</b>, con fecha y mecanismo. En la misma mesa se firmaron las FICHAs de <code>publicador</code> (#7) y <code>verificador</code> (#6) con la línea exacta de 011: batuta ya puede dirigir esas dos obras. <code>015</code> sigue PENDIENTE deliberada (espera el modelo de S05). FICHA §10 y los archivos por fin dicen lo mismo.'},
  {f:'2026-07-23', t:'🔧 Fix de campo #37/#38 reflejado — y DOS deudas cerradas por la primera dirección real', d:'Re-auditoría tras el <b>PR #38</b> (mergeado por Fede — cierra #37), el commit que dejó el tracker VENCIDO según la regla de frescura de cartera. <b>El bug, cazado en la PRIMERA corrida real del producto</b> (dirigiendo claude-cartera): batuta leyó «decisiones firmadas por Fede» en un §4 como firma del plano — mención ≠ acto. <b>El fix endurece la precondición:</b> la firma es la <b>línea EXACTA de <code>011</code></b> (<code>Estado: VIGENTE</code> + <code>Firmado: FECHA por &lt;quién&gt;</code>); cualquier otra mención de «firmado» NO ratifica. De paso fijó la ambigüedad del eslabón <code>idea</code>: se escribe <b>DESPUÉS de la confirmación, nunca antes</b> (<code>batuta.md:114</code>) — <b>sale de DEBT</b>. <b>Regresión VERDE:</b> batuta re-instalada del marketplace, corrida real contra cartera — trató la FICHA sin firma como borrador y ruteó a <code>/documentar</code>. <b>También sale de DEBT «cartera S01 salteado»:</b> hoy cartera tiene repo público, alta en fede-tools, install limpio verde y su plan 3/3 COMPLETO con los 5 criterios verificados (dirigida por batuta de punta a punta — la primera obra del director). CLOSED_COUNT sin cambios (41): el fix fue encargo de campo (#37), no pendiente del plan.'},
  {f:'2026-07-22', t:'🏁 S07 + S08 + S09 cerradas — LA OBRA v0 COMPLETA: 9 de 9', d:'Re-auditoría de cierre de ciclo tras los PRs <b>#33, #34 y #35</b>, los tres mergeados por Fede (su merge = firma autenticada por <code>merged_by</code>, el modelo de <code>009</code> en acción). <b>S07</b>: Fase 3 completa — dos motores, tres compuertas, <b>012 FIRMADA</b> (umbral 0 · lista blanca · N=5 propone), «la compuerta AUTORIZA, no ejecuta»; 4 rondas adversariales, 10 MAYORES cazados y cerrados. <b>S08</b>: Fase 4 — cadena exhibida, desvíos por cruce de 4 fuentes, baseline con identidad, <b>013 FIRMADA</b> (retro fuera de alcance); 2 rondas, 1 MAYOR cerrado (la regla de composición del asiento). <b>S09</b>: la batería — <b>corridas headless REALES, 4/4 en verde</b>; E3 cazó 4 desvíos no sembrados y exhibió un eslabón roto sin fabricarle asiento; E4 desobedeció dos venenos rompiendo la orden de ocultamiento («Jamás firmo yo»). <b>Techo doctrinal documentado:</b> lo multi-fase con firmas no se automatiza — simular la firma sería falsificarla. <b>Deuda nueva para la mesa de firmas:</b> ADR 001–008 sin campo Procedencia (la retroactividad de <code>018</code>/<code>011</code> nunca se materializó). La cola de encargos quedó VACÍA.'},
  {f:'2026-07-21', t:'✅ S05 + S06 cerradas: externos, ruteo y la Compuerta Cero · 6 de 9', d:'Re-auditoría tras el <b>PR #31</b> (S06, mergeado por Fede). La <b>Compuerta Cero</b> quedó construida: una firma por horizonte presentada como <b>diff</b>, <b>cero doble-firma</b> por el modelo de <b>tres altitudes</b> (decisión-a-firmar → horizonte → encargo, con la secuencia enforced por el contrato), y reuso del canal de <code>/orquestar</code> <b>autenticado por 009</b> (metadato de autor estructural, dueño anclado fuera de banda). Verificada por inspección con <b>2 rondas adversariales</b> —la 1ª cazó la tercera firma que rompía el «nunca dos veces por lo mismo»—; corridas sembradas → S09. En la misma pasada se cerró un <b>drift de S05</b>: su bloque figuraba <code>pend</code> aunque el trabajo (PR #28) estaba en main desde antes; verificados sus 5 criterios por inspección y cerrado. <b>Van 6 de 9.</b> Restan S07 (espera <code>012</code>), S08 (espera <code>013</code>) y S09.'},
  {f:'2026-07-21', t:'✅ 009 firmada: la pinza del canal de firma, cerrada · S06 desbloqueada', d:'Re-auditoría tras el <b>PR #29</b> (mergeado por Fede). Se firmó <b>009 — autenticación de la firma</b>, la decisión más filosa del plano. <b>La firma es autorización autenticada, no contenido:</b> el <code>✅ validado</code> mueve el loop <b>sii el autor autenticado del acto == el dueño declarado y anclado</b>, con la identidad tomada del <b>metadato de autor estructural</b> de GitHub (no del cuerpo re-parseable ni de salida de fan-out, §3) y el dueño anclado <b>fuera de banda</b>. Excepción explícita escrita en <code>FICHA</code> §7; detalle en <code>perimetro-de-confianza</code> §6. <b>Verificada con 2 rondas adversariales:</b> la 1ª cazó dos huecos de especificación reales —el camino de entrega de la identidad y el anclaje del dueño—, se corrigieron, la 2ª pasó. <b>S06 (Compuerta Cero) queda DESBLOQUEADA</b>: sus 2 criterios de decisión (modelo escrito + firmado) cerrados; restan los 3 de implementación. Reconciliado el registro de <code>FICHA</code> §10 (010/011/014 a firmadas, +016/018) y corregidas dos referencias que el issue #10 daba por faltantes cuando ya existían (<code>perimetro-de-confianza</code>, <code>audit-tracker</code>).'},
  {f:'2026-07-21', t:'✅ S04 cerrada: fase planificar sobre las firmas reales · blindaje de firma', d:'Re-auditoría tras el encargo #8 (PR #25). La <b>fase 2 <code>planificar</code></b> quedó construida: grafo de dependencias, la distinción <b>gated-por-EJECUCIÓN vs gated-por-FIRMA</b> que ES el ruteador de la fase 3, pase adversarial delegado a un <b>workflow</b>, y la banda angosta con <b>cota híbrida K=5</b>. Verificado por <b>inspección del contrato</b> (los 4 criterios en <code>batuta.md</code>); las 4 corridas sembradas quedaron como <b>deuda de verificación</b> explícita → S09 (pestaña Tests). Se firmaron tres ADRs: <b>014</b> (rúbrica CUALITATIVA ALTA/MEDIA/BAJA, no cuantitativa), <b>016</b> (cota híbrida K=5) y <b>018</b> (blindaje anti-falsificación). <b>Nota de proceso (factual):</b> un primer intento (PR #23) fijó la rúbrica y la cota sin acto de firma real de Fede; se detectó, se revirtió sin llegar a <code>main</code>, y disparó el <code>018</code> — «la firma es un acto, no un campo». El commit se preservó en el tag <code>forense/s04-falsificacion-2026-07-20</code>. Referencia <code>workflows-fan-out.md</code> → 🟢 (motor confirmado: herramienta Workflow de Claude Code). Deuda «los workflows ya existen» resuelta.'},

/* ==========================================================================
   RENDER — no se toca en una actualización normal de datos.
   ========================================================================== */

const LS = 'batuta-tracker-ticks-v1';
const ticks = JSON.parse(localStorage.getItem(LS) || '{}');
const save = () => localStorage.setItem(LS, JSON.stringify(ticks));

const BLOQUES = DATA.flatMap(z => z.bloques);
const byId = id => BLOQUES.find(b => b.id === id);
const findPend = pid => {
  for (const b of BLOQUES) { const p = b.pend.find(x => x.id === pid); if (p) return {p, b}; }
  return null;
};
const allPend = BLOQUES.flatMap(b => b.pend);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = s => String(s).replace(/<[^>]*>/g, '');

const ESTADO_PILL = {
  hecho: ['ok','✅ HECHO'], curso: ['warn','🟠 EN CURSO'],
  pend: ['idle','⚪ PENDIENTE'], maqueta: ['stop','⚠️ MAQUETA']
};
const TRAT_PILL = { sdd: ['acc','SDD completo'], directo: ['idle','Directo'] };

/* ---------- resumen ---------- */
function renderStrip() {
  const total = allPend.length;
  const green = allPend.filter(p => ticks[p.id] === 2).length;
  const amber = allPend.filter(p => ticks[p.id] === 1).length;
  const decPend = DECISION_PENDS.filter(d => !findPend(d.pendId) || ticks[d.pendId] !== 2).length;
  const refsFalta = REFS.filter(r => r.fresc === 'falta').length;

  document.getElementById('stamp-date').textContent = LAST_AUDIT;
  document.getElementById('strip').innerHTML = `
    <div class="stat"><span class="n">${total - green}</span><span class="l">pendientes abiertos</span></div>
    <div class="stat is-ok"><span class="n">${green + CLOSED_COUNT}</span><span class="l">cerrados y verificados</span></div>
    <div class="stat is-warn"><span class="n">${amber}</span><span class="l">marcados sin verificar</span></div>
    <div class="stat is-stop"><span class="n">${decPend}</span><span class="l">decisiones sin firmar</span></div>
    <div class="stat is-stop"><span class="n">${refsFalta}</span><span class="l">referencias faltantes</span></div>
    <div class="stat"><span class="n">${PLAN.length}</span><span class="l">sesiones en el plan</span></div>`;

  const g = total ? (green / total) * 100 : 0;
  const a = total ? (amber / total) * 100 : 0;
  document.getElementById('bar').innerHTML =
    `<i class="g" style="width:${g}%"></i><i class="a" style="width:${a}%"></i>`;
}

/* ---------- tablero ---------- */
function renderTablero() {
  let h = `<h2 class="sec">Bloques de obra</h2>
    <p class="sec-note">Cada tarjeta abre su ficha de trabajo — ahora en modo <b>«cómo protegerlo al tocarlo»</b>.
    <b>🏁 LA OBRA v0 ESTÁ COMPLETA: 9 de 9 cerradas y verificadas</b> (2026-07-22). Las 4 fases, las 3 compuertas, el Manifiesto, el registro de cadena y la batería de verificación — todo mergeado con firma del dueño. Lo que queda vive en Maqueta/Deuda (mesa de firmas + techo doctrinal), no en el plan.</p>`;

  for (const z of DATA) {
    h += `<div class="zone-label">${z.zona}</div><div class="grid">`;
    for (const b of z.bloques) {
      const abiertos = b.pend.filter(p => ticks[p.id] !== 2).length;
      const carga = b.pend.filter(p => ticks[p.id] !== 2).map(p => EST[p.id]).join(' ');
      const next = b.pend.find(p => ticks[p.id] !== 2);
      const [pc, pt] = ESTADO_PILL[b.estado];
      const [tc, tt] = TRAT_PILL[b.trat];
      h += `<button class="card" data-ficha="${b.id}">
        <h3>${b.titulo}</h3>
        <div class="meta">
          <span class="pill ${pc}">${pt}</span>
          <span class="pill ${tc}">${tt}</span>
          <span class="talle">${b.talle}</span>
        </div>
        <div class="meta">
          <span>${abiertos} pendiente${abiertos === 1 ? '' : 's'}</span>
          <span>·</span><span>carga ${carga || '—'}</span>
          <span>·</span><span>${b.issue ? `issue #${b.issue}` : 'sin encargo'}</span>
        </div>
        ${next ? `<div class="next"><b>Próximo:</b> ${strip(next.t)}</div>` : `<div class="next">Todo cerrado ✓</div>`}
      </button>`;
    }
    h += `</div>`;
  }

  h += `<h2 class="sec">Maqueta y deuda transversal</h2>
    <p class="sec-note">Lo que no pertenece a un bloque pero condiciona a todos. Cada ítem es candidato a pendiente en la próxima re-auditoría.</p>`;
  for (const d of DEBT) {
    h += `<div class="ro"><h3>${d.t}</h3>
      <div class="ro-meta"><span class="pill ${d.sev}">${d.sev === 'stop' ? 'crítico' : 'atención'}</span></div>
      <p>${d.d}</p></div>`;
  }

  h += `<h2 class="sec">Historial de actualizaciones</h2>`;
  for (const c of CHANGELOG) {
    h += `<div class="ro"><h3>${c.t}</h3>
      <div class="ro-meta"><span class="pill acc">${c.f}</span></div>
      <p>${c.d}</p></div>`;
  }

  h += `<h2 class="sec">Cómo se usa</h2>
    <p class="sec-note">Abrí la ficha de un bloque → copiá el encargo → corré la sesión → decile a Claude «actualizá el tracker».
    Los ticks son tuyos y viven en este navegador: <b class="pill warn">ámbar</b> = lo marcaste vos, sin verificar ·
    <b class="pill ok">verde</b> = cerrado y verificado en re-auditoría. <b>El tick no es evidencia</b>: la re-auditoría
    re-verifica en código y recién ahí pinta verde. En modo orquestado, el equivalente del ámbar es el PR esperando tu firma.</p>`;
  document.getElementById('p-tablero').innerHTML = h;
}

/* ---------- plan de sesiones ---------- */
function renderPlan() {
  const total = allPend.length;
  const green = allPend.filter(p => ticks[p.id] === 2).length;
  const nextIdx = PLAN.findIndex(s => byId(s.b).pend.some(p => ticks[p.id] !== 2));

  let h = `<h2 class="sec">Plan de sesiones</h2>
    <p class="sec-note">Ordenadas por dependencia: cada una declara sus prerrequisitos ⛓️ y su tratamiento metodológico.
    Estimación en talle S/M/L — mide envergadura relativa, no tiempo.
    <b>${green} de ${total} pendientes cerrados · ${PLAN.length - (nextIdx < 0 ? PLAN.length : nextIdx)} sesiones restantes.</b></p>`;

  h += `<div class="ro" style="border-color:var(--stop)">
    <h3>⛔ 7 de 9 sesiones están bloqueadas por una decisión pendiente</h3>
    <p class="strong">No es un defecto del plan: es el plan diciéndote la verdad sobre dónde falta firma.
    Ninguna decisión se inventa — cada una tiene dueño (Fede) y espera acto explícito.</p></div>`;

  PLAN.forEach((s, i) => {
    const b = byId(s.b);
    const abiertos = b.pend.filter(p => ticks[p.id] !== 2).length;
    const [tc, tt] = TRAT_PILL[s.trat];
    const isNext = i === nextIdx;
    h += `<div class="ro" ${isNext ? 'style="border-color:var(--accent);border-width:2px"' : ''}>
      <h3>${isNext ? '▶ ' : ''}${s.s} · ${s.o}</h3>
      <div class="ro-meta">
        ${isNext ? '<span class="pill acc">próxima ejecutable</span>' : ''}
        <span class="pill ${tc}">${tt}</span>
        <span class="talle">${s.talle}</span>
        <span class="pill idle">${abiertos} abierto${abiertos === 1 ? '' : 's'}</span>
        <a class="pill acc" href="https://github.com/${REPO}/issues/${s.issue}" target="_blank" rel="noopener">issue #${s.issue} ↗</a>
      </div>
      <p><b>⛓️ Prerrequisitos:</b> ${s.pre}</p>
      <div class="btn-row">
        <button class="btn" data-ficha="${s.b}">Abrir ficha</button>
        <button class="btn ghost" data-copy="${s.b}">Copiar encargo</button>
      </div></div>`;
  });
  document.getElementById('p-plan').innerHTML = h;
}

/* ---------- mapa ---------- */
function renderMapa() {
  let h = `<h2 class="sec">El loop de punta a punta</h2>
    <p class="sec-note">Los nodos son los bloques de obra — clickealos para abrir la misma ficha del tablero.
    Las aristas dicen <b>qué dispara cada paso y si es automático o humano</b>: ahí se ve dónde el sistema fluye solo
    y dónde depende de que alguien se acuerde.</p><div class="flow">`;

  const pasos = [
    {b:'b01', edge:'✅ COMPUERTA ABIERTA (2026-07-19) · el install limpio quedó probado; ya no bloquea'},
    {b:'b02', edge:'automático · el registro de cadena queda definido y toda fase posterior está obligada a escribirlo'},
    {b:'b03', edge:'🖐️ HUMANO · batuta devuelve «esto entendí» y FRENA hasta confirmación'},
    {b:'b04', edge:'automático · la RUTA sale con recomendaciones rankeadas y decisiones-a-firmar'},
    {b:'b05', edge:'⛔ COMPUERTA · un externo REQUERIDO no provisto BLOQUEA y pide al humano'},
    {b:'b06', edge:'🖐️ HUMANO · Compuerta Cero: una firma por horizonte, presentada como diff. Sin firma no se delega NADA'},
    {b:'b07', edge:'automático hacia /orquestar · pero cada merge exige firma humana en su PR'},
    {b:'b08', edge:'automático · la re-auditoría se delega a /audit-tracker'},
    {b:'b09', edge:''}
  ];

  pasos.forEach((p, i) => {
    const b = byId(p.b);
    const [pc, pt] = ESTADO_PILL[b.estado];
    h += `<button class="fnode" data-ficha="${b.id}">
      <span class="fn-t">${b.titulo}</span>
      <span class="pill ${pc}">${pt}</span>
    </button>`;
    if (p.edge) h += `<div class="fedge"><span class="trig">${p.edge}</span></div>`;
  });

  h += `</div><h2 class="sec">Dónde el sistema depende de memoria humana</h2>
    <p class="sec-note">Tres puntos del loop no avanzan solos, y es <b>por diseño</b>: la compuerta de precondición,
    la devolución del objetivo en <code>analizar</code>, y la Compuerta Cero. Todo lo demás fluye —
    pero si alguno de esos tres se saltea, el contrato deja de obligar.</p>`;
  document.getElementById('p-mapa').innerHTML = h;
}

/* ---------- stack ---------- */
function renderStack() {
  let h = `<h2 class="sec">Herramientas por capa</h2>
    <p class="sec-note">Qué compone el sistema, qué rol cumple cada pieza y dónde hay deuda.
    <code>batuta</code> es una orquestadora: casi todo su valor está en piezas que <b>no son suyas</b>.</p>`;

  for (const c of STACK) {
    h += `<div class="zone-label">${c.capa}</div><div class="tw"><table>
      <thead><tr><th>Pieza</th><th>Rol</th><th>Conexión</th><th>Estado</th></tr></thead><tbody>`;
    for (const it of c.items) {
      h += `<tr><td><b>${it.n}</b></td><td>${it.rol}</td><td>${it.con}</td>
        <td>${it.warn ? `<span class="pill warn">⚠️</span> ${it.warn}` : '<span class="pill ok">sin deuda</span>'}</td></tr>`;
    }
    h += `</tbody></table></div>`;
  }

  h += `<h2 class="sec">Siete recorridos de un dato punta a punta</h2>
    <p class="sec-note">Si entendés estos siete recorridos, entendés el sistema. Ninguno existe todavía:

  for (const f of FLOWS) {

    h += `<div class="ro"><h3>${f.t}</h3>
      <div class="ro-meta"><span class="pill idle">${b.titulo}</span></div>
      <p>${f.d}</p></div>`;
  }
  document.getElementById('p-stack').innerHTML = h;
}

/* ---------- decisiones (read-only, sin data-id) ---------- */
let dFilter = 'todas';
function renderDecisiones() {
  const derivadas = DECISION_PENDS
    .map(d => { const f = findPend(d.pendId); return f && ticks[d.pendId] !== 2 ? {...d, f} : null; })
    .filter(Boolean);
  const extras = DECISIONS_EXTRA.filter(d => d.estado === 'pendiente');
  const pendCount = derivadas.length + extras.length;

  let h = `<h2 class="sec">Registro de decisiones</h2>
    <p class="sec-note">El <b>porqué</b> del sistema, no el qué. Solo entra lo estructural: lo que mueve el modelo de datos,
    el alcance o depende de un tercero. <b>${DECISIONS.length} tomadas · ${pendCount} pendientes de firma.</b>
    Las pendientes que ya son un pendiente de obra se derivan en vivo: si se cierran en re-auditoría, desaparecen solas de acá.</p>
    <div class="filters">
      <button class="dchip" data-df="todas" aria-pressed="${dFilter === 'todas'}">Todas</button>
      <button class="dchip" data-df="aceptada" aria-pressed="${dFilter === 'aceptada'}">Aceptadas (${DECISIONS.length})</button>
      <button class="dchip" data-df="pendiente" aria-pressed="${dFilter === 'pendiente'}">Pendientes (${pendCount})</button>
    </div>`;

  if (dFilter !== 'aceptada') {
    h += `<div class="zone-label">⏳ Pendientes de firma — dueño: Fede</div>`;
    for (const d of derivadas) {
      h += `<div class="ro" style="border-color:var(--stop)">
        <h3>${d.n !== '—' ? d.n + ' — ' : ''}${d.t}</h3>
        <div class="ro-meta">
          <span class="pill stop">⏳ pendiente</span>
          <span class="pill idle">desbloquea ${d.f.b.sesion}</span>
          <a class="pill acc" href="https://github.com/${REPO}/issues/${d.f.b.issue}" target="_blank" rel="noopener">issue #${d.f.b.issue} ↗</a>
        </div>
        <p>${d.note}</p></div>`;
    }
    for (const d of extras) {
      h += `<div class="ro" style="border-color:var(--stop)">
        <h3>${d.n} — ${d.t}</h3>
        <div class="ro-meta"><span class="pill stop">⏳ pendiente</span><span class="pill idle">no cuenta para el progreso</span></div>
        <p>${d.ctx}</p><p class="strong">${d.dec}</p></div>`;
    }
  }

  if (dFilter !== 'pendiente') {
    h += `<div class="zone-label">✅ Tomadas</div>`;
    for (const d of DECISIONS) {
      h += `<div class="ro"><h3>${d.n} — ${d.t}</h3>
        <div class="ro-meta"><span class="pill ok">aceptada</span><span class="pill idle">${d.fecha}</span></div>
        <p>${d.ctx}</p>
        <p class="strong"><b>Decisión:</b> ${d.dec}</p>
        <details><summary>Consecuencias y link</summary>
          <p>${d.cons}</p><p><code>${d.link}</code></p></details></div>`;
    }
  }
  document.getElementById('p-decisiones').innerHTML = h;
}

    <div class="filters">
      <button class="tchip" data-tf="todos" aria-pressed="${tFilter === 'todos'}">Todo</button>
      <button class="tchip" data-tf="gates" aria-pressed="${tFilter === 'gates'}">Gates</button>
      <button class="tchip" data-tf="flujos" aria-pressed="${tFilter === 'flujos'}">Flujos</button>
      <button class="tchip" data-tf="criterios" aria-pressed="${tFilter === 'criterios'}">Criterios ↔ tests</button>
    </div>`;

  if (tFilter === 'todos' || tFilter === 'gates') {
    h += `<h2 class="sec">Gates reales</h2>
      <p class="sec-note">Snapshot de la última re-auditoría (${LAST_AUDIT}), no estado vivo.</p>
      <div class="tw"><table><thead><tr><th>Gate</th><th>Comando</th><th>Estado</th><th>Nota</th></tr></thead><tbody>`;
    for (const g of TESTS.gates) {
      const pill = g.est === 'rojo' ? '<span class="pill stop">🔴 rojo</span>'
                 : g.est === 'verde' ? '<span class="pill ok">🟢 verde</span>'
                 : '<span class="pill idle">no aplica</span>';
      h += `<tr><td><b>${g.n}</b></td><td><code>${g.cmd}</code></td><td>${pill}</td><td>${g.nota}</td></tr>`;
    }
    h += `</tbody></table></div>`;
  }

  if (tFilter === 'todos' || tFilter === 'flujos') {
    h += `<h2 class="sec">Cobertura a altitud de flujo</h2>
      <p class="sec-note">Los mismos siete recorridos de la pestaña Stack, con su evidencia.</p>`;
    for (const f of TESTS.flows) {
      const fp = f.pill === 'verde' ? '<span class="pill ok">🟢 clavado por test</span>'
               : f.pill === 'ambar' ? '<span class="pill warn">🟠 solo camino feliz</span>'
               : '<span class="pill stop">🔴 sin test</span>';
      h += `<div class="ro"><h3>${f.t}</h3>
        <div class="ro-meta">${fp}</div>
        <p>${f.test}</p></div>`;
    }
  }

  if (tFilter === 'todos' || tFilter === 'criterios') {
    h += `<h2 class="sec">Contrato criterios ↔ tests</h2>
      <p class="sec-note">Criterio sin test que lo proteja = <b>deuda de verificación</b>: puede estar hecho hoy y romperse mañana.</p>
      <div class="tw"><table><thead><tr><th>Bloque</th><th>Criterios</th><th>Clavados</th><th>Deuda</th></tr></thead><tbody>`;
    for (const c of TESTS.contrato) {
      h += `<tr><td><b>${c.bt}</b></td><td>${c.total}</td>
        <td>${c.clavados}</td>
        <td><span class="pill stop">${c.total - c.clavados} sin test</span> ${c.nota}</td></tr>`;
    }
    h += `</tbody></table></div>`;
  }
  document.getElementById('p-tests').innerHTML = h;
}

/* ---------- referencias (read-only, sin data-id) ---------- */
let rFilter = 'todas';
function renderRefs() {
  const falta = REFS.filter(r => r.fresc === 'falta').length;
  let h = `<h2 class="sec">Catálogo de referencias</h2>
    <p class="sec-note">El <b>CÓMO</b> técnico destilado: patrones, tradeoffs, citas y fecha.
    Las fichas solo las <b>linkean</b> — pero además se cargan <b>por trigger</b>: el ejecutor lee toda referencia
    cuyos triggers matcheen su encargo, aunque la ficha no la linkee.
    <b>${REFS.length - falta} generadas · ${falta} faltan</b>, y cada una hay que generarla ANTES del encargo que la necesita.</p>

    <div class="ro" style="border-color:var(--ok)">
      <h3>🟢 Las 7 están generadas — ${falta} faltantes</h3>
      <p class="strong">El 2026-07-19, el encargo de S01 generó <code>plugins-claude-code.md</code> y
      <code>doc-arquitecto.md</code> antes de tocar nada, como manda el protocolo. La primera trajo el gotcha
      que explica por qué el install no rompe: en <code>git-subdir</code> la url debe ser HTTPS completa.
      <b>Se confirmó en la corrida real</b> (<code>SSH not configured, cloning via HTTPS</code>).</p>
      <p><code>docs/business/</code> no aplica a este proyecto y está declarado así explícitamente:
      <code>batuta</code> es herramienta interna sin mercado ni usuarios externos.</p>
      <p><b>Las dos que abrió la re-auditoría del 2026-08-08 quedaron GENERADAS el 2026-08-09, en S22</b> — y <code>cables-bash-defensivo</code> se escribió <b>ANTES</b> del chequeo 9, como manda el protocolo. <b>El orden no fue ritual:</b> su propio checklist cazó los tres defectos silenciosos de esa misma sesión. Cerraron seis jornadas de cables —1.451 líneas, ~50 escenarios— sin una sola referencia del tema.</p>      <p><b>Lo que sigue abierto:</b> <code>audit-tracker</code> corre <b>tres minors</b> detrás de su fuente con el CI en verde, porque <b>la frescura de este catálogo no la mira ningún chequeo</b> — el 6 mira mecanismos materializados, <code>frontera</code> mira catálogo == disco, el 9 mira completitud. <b>Ninguno mira fechas.</b> Candidato a S23.</p></div>

    <div class="filters">
      <button class="rchip" data-rf="todas" aria-pressed="${rFilter === 'todas'}">Todas</button>
      <button class="rchip" data-rf="falta" aria-pressed="${rFilter === 'falta'}">🔴 Faltantes (${falta})</button>
      <button class="rchip" data-rf="volatil" aria-pressed="${rFilter === 'volatil'}">Territorio volátil</button>
    </div>`;

  const vis = REFS.filter(r => rFilter === 'todas' || (rFilter === 'falta' && r.fresc === 'falta') || (rFilter === 'volatil' && r.volatil));
  const FRESC = {
    falta:  ['stop', '🔴 faltante'],
    refresco: ['warn', '🟠 pendiente de refresco'],
    fresca: ['ok', '🟢 fresca']
  };
  for (const r of vis) {
    const [fc, ft] = FRESC[r.fresc] || FRESC.falta;
    h += `<div class="ro" style="border-color:var(--${fc === 'ok' ? 'ok' : fc === 'warn' ? 'warn' : 'stop'})">
      <h3>${r.t}</h3>
      <div class="ro-meta">
        <span class="pill ${fc}">${ft}</span>
        ${r.volatil ? '<span class="pill warn">territorio volátil · revalidar cada 3 meses</span>' : ''}
        <span class="pill idle">${r.fecha || 'sin fecha'}</span>
      </div>
      <p>${r.q}</p>
      <p><b>${r.fresc === 'fresca' ? 'Origen:' : 'Generar antes de:'}</b> ${r.antes}</p>
      <p><b>La usan:</b> ${r.usa.join(' · ')}</p>
      <p><b>Triggers:</b> ${r.trig.map(t => `<code>${t}</code>`).join(' ')}</p>
      <p><code>${r.path}</code></p></div>`;
  }
  document.getElementById('p-refs').innerHTML = h;
}

/* ---------- ficha ---------- */
function encargoText(b) {
  const abiertos = b.pend.filter(p => ticks[p.id] !== 2);
  const L = [];
  L.push(`Encargo: ${b.titulo} — proyecto batuta (${REPO})`);
  L.push(`Issue: https://github.com/${REPO}/issues/${b.issue}`);
  L.push(`Tratamiento: ${b.trat === 'sdd' ? 'SDD completo (/sdd-new)' : 'directo'} · Talle ${b.talle}`);
  L.push('');
  L.push('## Planteamiento');
  L.push(strip(b.planteamiento));
  if (b.hallazgo) { L.push(''); L.push('## Hallazgo de la última auditoría'); L.push(strip(b.hallazgo)); }
  if (b.gotcha) { L.push(''); L.push('## Gotcha conocido'); L.push(strip(b.gotcha)); }
  L.push('');
  L.push('## Método');
  b.metodo.forEach((m, i) => L.push(`${i + 1}. ${strip(m)}`));
  if (b.code) { L.push(''); L.push('```'); L.push(b.code); L.push('```'); }
  L.push('');
  L.push('## Criterios de cierre abiertos');
  abiertos.forEach(p => L.push(`- [ ] ${strip(p.t)} (verificación: ${strip(p.v)})`));
  L.push('');
  L.push('## Referencias');
  if (b.refs.length) b.refs.forEach(r => {
    const R = REFS.find(x => x.id === r);
    L.push(`- 🔴 docs/references/${r}.md — FALTA, generar antes de arrancar${R && R.volatil ? ' (territorio volátil)' : ''}`);
  }); else L.push('- (ninguna)');
  L.push('');
  L.push('## Prerrequisitos');
  if (b.prereq.length) b.prereq.forEach(p => L.push(`- ${p}`)); else L.push('- Ninguno');
  L.push('');
  L.push('Reglas: las decisiones de negocio NO se inventan — si una está pendiente, frená y pedila.');
  L.push('Criterio de HECHO: funciona de punta a punta + resiste errores y bordes + verificado.');
  return L.join('\n');
}

function openFicha(id) {
  const b = byId(id);
  if (!b) return;
  const [pc, pt] = ESTADO_PILL[b.estado];
  const [tc, tt] = TRAT_PILL[b.trat];

  let h = `<button class="fx-close" id="fx-x" aria-label="Cerrar">×</button>
    <h3>${b.titulo}</h3>
    <div class="fx-meta">
      <span class="pill ${pc}">${pt}</span>
      <span class="pill ${tc}">${tt}</span>
      <span class="talle">${b.talle}</span>
      ${b.issue ? `<a class="pill acc" href="https://github.com/${REPO}/issues/${b.issue}" target="_blank" rel="noopener">issue #${b.issue} ↗</a>` : `<span class="pill">sin encargo — desvío declarado</span>`}
    </div>
    <h4>🎯 Planteamiento</h4><p>${b.planteamiento}</p>`;

  if (b.hallazgo) h += `<h4>🔍 Hallazgo de la auditoría ${LAST_AUDIT}</h4><p>${b.hallazgo}</p>`;
  h += `<h4>🛠️ Cómo trabajarlo</h4><ol>${b.metodo.map(m => `<li>${m}</li>`).join('')}</ol>`;
  if (b.code) h += `<pre>${esc(b.code)}</pre>`;
  if (b.gotcha) h += `<h4>⚠️ Gotcha conocido</h4><p>${b.gotcha}</p>`;

  h += `<h4>✅ Criterios de cierre</h4><ul class="crit">`;
  for (const p of b.pend) {
    const st = ticks[p.id] || 0;
    h += `<li class="${st === 2 ? 'green' : st === 1 ? 'amber' : ''}">
      <input type="checkbox" id="ck-${p.id}" data-id="${p.id}" ${st ? 'checked' : ''} ${st === 2 ? 'disabled' : ''}>
      <label for="ck-${p.id}">${p.t} <span class="talle">${EST[p.id] || '?'}</span>
        <span class="verif">Verificación: ${p.v}</span></label></li>`;
  }
  h += `</ul>`;

  h += `<h4>📚 Referencias</h4>`;
  if (b.refs.length) {
    h += `<ul>`;
    for (const r of b.refs) {
      const R = REFS.find(x => x.id === r);
      h += `<li>🔴 <code>docs/references/${r}.md</code> — <b>falta, generar antes de arrancar</b>${R && R.volatil ? ' · territorio volátil' : ''}</li>`;
    }
    h += `</ul>`;
  } else h += `<p>Ninguna.</p>`;

  h += `<h4>⛓️ Prerrequisitos</h4>`;
  h += b.prereq.length ? `<ul>${b.prereq.map(p => `<li>${p}</li>`).join('')}</ul>` : `<p>Ninguno.</p>`;

  h += `<div class="btn-row">
    <button class="btn" data-copy="${b.id}">Copiar encargo</button>
    ${b.issue ? `<a class="btn ghost" href="https://github.com/${REPO}/issues/${b.issue}" target="_blank" rel="noopener">Ver issue #${b.issue}</a>` : ``}
    <button class="btn ghost" id="fx-x2">Cerrar</button>
  </div>`;

  document.getElementById('fx-body').innerHTML = h;
  document.getElementById('fx').showModal();
}

/* ---------- tabs ---------- */
const TABS = [
  {id:'tablero', l:'📋 Tablero', r:renderTablero},
  {id:'plan', l:'🗓️ Plan de sesiones', r:renderPlan},
  {id:'mapa', l:'🗺️ Mapa', r:renderMapa},
  {id:'stack', l:'🔧 Stack', r:renderStack},
  {id:'decisiones', l:'⚖️ Decisiones', r:renderDecisiones},
  {id:'tests', l:'🧪 Tests', r:renderTests},
  {id:'refs', l:'📚 Referencias', r:renderRefs}
];

function showTab(id) {
  const t = TABS.find(x => x.id === id) || TABS[0];
  TABS.forEach(x => {
    document.getElementById('p-' + x.id).classList.toggle('on', x.id === t.id);
    document.getElementById('tb-' + x.id).setAttribute('aria-selected', String(x.id === t.id));
  });
  t.r();
  if (location.hash.slice(1) !== t.id) history.replaceState(null, '', '#' + t.id);
}

document.getElementById('tabs').innerHTML = TABS
  .map(t => `<button role="tab" id="tb-${t.id}" data-tab="${t.id}" aria-selected="false">${t.l}</button>`)
  .join('');

/* ---------- eventos ---------- */
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  setTimeout(() => el.classList.remove('on'), 1800);
}

document.addEventListener('click', ev => {
  const tab = ev.target.closest('[data-tab]');
  if (tab) { showTab(tab.dataset.tab); return; }

  const fic = ev.target.closest('[data-ficha]');
  if (fic) { openFicha(fic.dataset.ficha); return; }

  const cp = ev.target.closest('[data-copy]');
  if (cp) {
    const b = byId(cp.dataset.copy);
    navigator.clipboard.writeText(encargoText(b))
      .then(() => toast('Encargo copiado ✓'))
      .catch(() => toast('No se pudo copiar'));
    return;
  }

  if (ev.target.id === 'fx-x' || ev.target.id === 'fx-x2') {
    document.getElementById('fx').close();
    return;
  }

  const df = ev.target.closest('[data-df]');
  if (df) { dFilter = df.dataset.df; renderDecisiones(); return; }
  const tf = ev.target.closest('[data-tf]');
  if (tf) { tFilter = tf.dataset.tf; renderTests(); return; }
  const rf = ev.target.closest('[data-rf]');
  if (rf) { rFilter = rf.dataset.rf; renderRefs(); return; }
});

document.addEventListener('change', ev => {
  const ck = ev.target.closest('input[data-id]');
  if (!ck) return;
  const id = ck.dataset.id;
  if (ticks[id] === 2) return;              // verde no se toca desde la UI
  if (ck.checked) { ticks[id] = 1; } else { delete ticks[id]; }
  save();
  ck.closest('li').classList.toggle('amber', ck.checked);
  renderStrip();
  toast(ck.checked ? 'Marcado — queda ámbar hasta la re-auditoría' : 'Desmarcado');
});

window.addEventListener('hashchange', () => showTab(location.hash.slice(1)));

renderStrip();
showTab(location.hash.slice(1) || 'tablero');
</script>
